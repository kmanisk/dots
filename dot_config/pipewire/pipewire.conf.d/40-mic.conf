# ==============================================================================
# 40-mic.conf — Unified PipeWire Broadcast Microphone & Voice Engine
# Single-device virtual microphone architecture: ghelper-audio
# Fully headless & daemonless DSP pipeline
# ==============================================================================

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "MicStudio Unified"
            media.name       = "MicStudio Unified"
            filter.graph = {
                nodes = [
                    # 1. 80 Hz Rumble Cut Highpass
                    {
                        type   = builtin
                        name   = hpf_80
                        label  = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    }

                    # 2. HushMic DPDFNet Neural Noise Suppressor
                    {
                        type   = ladspa
                        name   = dpdfnet
                        plugin = "/usr/lib/ladspa/libdeep_filter_ladspa.so"
                        label  = "deep_filter_mono"
                        control = { "Attenuation Limit (dB)" = 45.0 }
                    }

                    # 3. Real-Time Pitch & Formant Shifter (RubberBand Live Mono)
                    {
                        type   = ladspa
                        name   = pitch_shifter
                        plugin = "ladspa-rubberband"
                        label  = "rubberband-live-pitchshifter-mono"
                        control = {
                            "Semitones"          = 0.0
                            "Octaves"            = 0.0
                            "Cents"              = 0.0
                            "Formant Preserving" = 0.0
                            "Wet-Dry Mix"        = 1.0
                        }
                    }

                    # 4. Ring Modulator & Tremolo / Stutter (swh-plugins)
                    {
                        type   = ladspa
                        name   = ringmod
                        plugin = "ringmod_1188"
                        label  = "ringmod_1i1o1l"
                        control = {
                            "Modulation depth (0=none, 1=AM, 2=RM)" = 0.0
                            "Frequency (Hz)"                       = 100.0
                            "Sine level"                            = 1.0
                            "Triangle level"                        = 0.0
                            "Sawtooth level"                        = 0.0
                            "Square level"                          = 0.0
                        }
                    }

                    # 5. Bitcrusher & Sample Rate Decimator (swh-plugins)
                    {
                        type   = ladspa
                        name   = decimator
                        plugin = "decimator_1202"
                        label  = "decimator"
                        control = {
                            "Bit depth"        = 24.0
                            "Sample rate (Hz)" = 48000.0
                        }
                    }

                    # 6. Flanger / Chorus Space Modulation (LSP LADSPA)
                    {
                        type   = ladspa
                        name   = flanger
                        plugin = "lsp-plugins-ladspa"
                        label  = "http://lsp-plug.in/plugins/ladspa/flanger_mono"
                        control = {
                            "Bypass"        = 1.0
                            "Rate (Hz)"     = 0.5
                            "Crossfade (%)" = 25.0
                        }
                    }

                    # 7. Multi-Tap Delay / Echo / Room Reverb (swh-plugins)
                    {
                        type   = ladspa
                        name   = delay
                        plugin = "delayorama_1402"
                        label  = "delayorama"
                        control = {
                            "Random seed"          = 0.0
                            "Input gain (dB)"      = 0.0
                            "Feedback (%)"         = 0.0
                            "Number of taps"       = 2.0
                            "First delay (s)"      = 0.0
                            "Delay range (s)"      = 1.0
                            "Delay change"         = 1.0
                            "Delay random (%)"     = 0.0
                            "Amplitude change"     = 1.0
                            "Amplitude random (%)" = 0.0
                            "Dry/wet mix"          = 0.0
                        }
                    }

                    # 8. High-Pass Filter (builtin biquad)
                    {
                        type   = builtin
                        name   = eq_hpf
                        label  = bq_highpass
                        control = { "Freq" = 20.0 "Q" = 0.707 }
                    }

                    # 9. Low-Pass Filter (builtin biquad)
                    {
                        type   = builtin
                        name   = eq_lpf
                        label  = bq_lowpass
                        control = { "Freq" = 20000.0 "Q" = 0.707 }
                    }

                    # 10. Peaking Filter (builtin biquad)
                    {
                        type   = builtin
                        name   = eq_peak
                        label  = bq_peaking
                        control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 0.0 }
                    }

                    # 11. Clean Broadcast Parametric EQ Cascade
                    { type = builtin name = eq_80   label = bq_lowshelf  control = { "Freq" = 80.0    "Q" = 0.707 "Gain" = -2.0 } }
                    { type = builtin name = eq_120  label = bq_lowshelf  control = { "Freq" = 120.0   "Q" = 0.707 "Gain" =  0.0 } }
                    { type = builtin name = eq_250  label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0   "Gain" =  0.0 } }
                    { type = builtin name = eq_400  label = bq_peaking   control = { "Freq" = 400.0   "Q" = 1.0   "Gain" = -1.5 } }
                    { type = builtin name = eq_1k5  label = bq_peaking   control = { "Freq" = 1500.0  "Q" = 1.0   "Gain" =  0.0 } }
                    { type = builtin name = eq_3k5  label = bq_peaking   control = { "Freq" = 3500.0  "Q" = 0.8   "Gain" =  1.5 } }
                    { type = builtin name = eq_6k   label = bq_peaking   control = { "Freq" = 6000.0  "Q" = 1.0   "Gain" =  0.0 } }
                    { type = builtin name = eq_9k   label = bq_highshelf control = { "Freq" = 9000.0  "Q" = 0.7   "Gain" =  0.0 } }
                    { type = builtin name = eq_12k  label = bq_highshelf control = { "Freq" = 12000.0 "Q" = 1.0   "Gain" =  0.0 } }

                    # 12. Studio Vocal Compressor (Anti-Shout Guard: 10ms attack, 120ms hold, 300ms release)
                    {
                        type   = ladspa
                        name   = compressor
                        plugin = "lsp-plugins-ladspa"
                        label  = "http://lsp-plug.in/plugins/ladspa/compressor_mono"
                        control = {
                            "Attack threshold (G)" = 0.251189
                            "Ratio"                = 2.0
                            "Attack time (ms)"     = 10.0
                            "Hold time (ms)"       = 120.0
                            "Release time (ms)"    = 300.0
                            "Knee (G)"             = 0.501196
                            "Makeup gain (G)"      = 1.000000
                        }
                    }

                    # 13. Studio Vocal Limiter (-2 dBFS true peak guard for Opus/Discord/game headroom)
                    {
                        type   = ladspa
                        name   = limiter
                        plugin = "lsp-plugins-ladspa"
                        label  = "http://lsp-plug.in/plugins/ladspa/limiter_mono"
                        control = {
                            "Threshold (G)"              = 0.794328
                            "Lookahead (ms)"             = 5.0
                            "Attack time (ms)"           = 2.0
                            "Release time (ms)"          = 20.0
                            "Output gain (G)"            = 1.000000
                            "Automatic level regulation" = 0.0
                            "Gain boost"                 = 0.0
                        }
                    }
                ]
                links = [
                    # Pre-HPF -> DPDFNet
                    { output = "hpf_80:Out"           input = "dpdfnet:Audio In" }

                    # DPDFNet -> Creative Voice FX Cascade
                    { output = "dpdfnet:Audio Out"    input = "pitch_shifter:Input" }
                    { output = "pitch_shifter:Output" input = "ringmod:Input" }
                    { output = "ringmod:Output"       input = "decimator:Input" }
                    { output = "decimator:Output"     input = "flanger:Input" }
                    { output = "flanger:Output"       input = "delay:Input" }
                    { output = "delay:Output"         input = "eq_hpf:In" }
                    { output = "eq_hpf:Out"           input = "eq_lpf:In" }
                    { output = "eq_lpf:Out"           input = "eq_peak:In" }

                    # Voice FX -> Clean Parametric EQ Cascade
                    { output = "eq_peak:Out"          input = "eq_80:In" }
                    { output = "eq_80:Out"            input = "eq_120:In" }
                    { output = "eq_120:Out"           input = "eq_250:In" }
                    { output = "eq_250:Out"           input = "eq_400:In" }
                    { output = "eq_400:Out"           input = "eq_1k5:In" }
                    { output = "eq_1k5:Out"           input = "eq_3k5:In" }
                    { output = "eq_3k5:Out"           input = "eq_6k:In" }
                    { output = "eq_6k:Out"            input = "eq_9k:In" }
                    { output = "eq_9k:Out"            input = "eq_12k:In" }

                    # Clean Parametric EQ -> Anti-Shout Compressor -> Peak Limiter
                    { output = "eq_12k:Out"           input = "compressor:Input" }
                    { output = "compressor:Output"    input = "limiter:Input" }
                ]
                inputs  = [ "hpf_80:In" ]
                outputs = [ "limiter:Output" ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "capture.ghelper-audio"
                node.passive     = true
                target.object    = "alsa_input.pci-0000_00_1f.3.analog-stereo"
            }
            playback.props = {
                node.name        = "ghelper-audio"
                node.description = "MicStudio (DPDFNet & Anti-Shout)"
                media.class      = "Audio/Source"
                audio.channels   = 1
                audio.position   = [ MONO ]
                priority.session = 3000
            }
        }
    }
]
