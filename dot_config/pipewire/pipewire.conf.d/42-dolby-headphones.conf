# Headphone Base Chain (Device-Agnostic Dolby Enhancement)
# Stages: Dialogue Clarity -> AutoGain Leveler -> Multiband Dynamics -> Studio Limiter
# (Calf stereo widening and Speaker FIR completely omitted)

context.modules = [
    {
        name = "libpipewire-module-filter-chain"
        flags = [ "ifexists" "nofail" ]
        args = {
            node.description = "Dolby Headphone Enhancement"
            media.name = "Dolby Headphone Enhancement"
            filter.graph = {
                nodes = [
                    # 1. Dialogue Enhancement (LSP 16-band Parametric EQ)
                    {
                        type = "lv2"
                        name = "dialog"
                        plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x16_lr"
                        control = {
                            mode = 0
                            g_in = 1.0
                            g_out = 1.0
                            ftl_0 = 0
                            ftr_0 = 0
                            ftl_1 = 3
                            ftr_1 = 3
                            fl_1 = 3000
                            fr_1 = 3000
                            ql_1 = 1.0
                            qr_1 = 1.0
                            gl_1 = 1.2589
                            gr_1 = 1.2589
                        }
                    }
                    # 2. AutoGain Leveler (LSP AutoGain Stereo)
                    {
                        type = "lv2"
                        name = "autogain"
                        plugin = "http://lsp-plug.in/plugins/lv2/autogain_stereo"
                        control = {
                            level = -18
                            silence = -70
                            weight = 5
                            lkahead = 0
                            tgrow_l = 7500
                            tfall_l = 3000
                            max_on = 1
                            max_amp = 6.0
                            vfall_l = 3
                            vfall_s = 3
                            vgrow_l = 6
                            vgrow_s = 6
                        }
                    }
                    # 3. Headphone Dynamics (LSP Multiband Compressor Stereo)
                    {
                        type = "lv2"
                        name = "reg"
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            mode = 1
                            g_in = 1.0
                            g_out = 1.0
                            g_dry = 0.0
                            g_wet = 1.0
                            envb = 0
                            ce_0 = 1
                            al_0 = 0.5
                            at_0 = 5
                            rt_0 = 100
                            cr_0 = 2.0
                            kn_0 = 0.5
                            mk_0 = 1
                        }
                    }
                    # 4. Studio Limiter (LSP Limiter Stereo)
                    {
                        type = "lv2"
                        name = "limiter"
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            mode = 0
                            g_in = 1.0
                            g_out = 1.0
                            th = 0.98855
                            lk = 1
                            at = 1
                            rt = 5
                            slink = 100
                            alr = 0
                            boost = 0
                        }
                    }
                ]
                links = [
                    { output = "dialog:out_l"   input = "autogain:in_l" }
                    { output = "dialog:out_r"   input = "autogain:in_r" }
                    { output = "autogain:out_l" input = "reg:in_l" }
                    { output = "autogain:out_r" input = "reg:in_r" }
                    { output = "reg:out_l"      input = "limiter:in_l" }
                    { output = "reg:out_r"      input = "limiter:in_r" }
                ]
                inputs  = [ "dialog:in_l" "dialog:in_r" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            audio.channels = 2
            audio.position = [ "FL" "FR" ]
            capture.props = {
                node.name               = "effect_input.Dolby_Headphones"
                node.description        = "Dolby Headphone Enhancement"
                media.class             = "Audio/Sink"
                node.link-group         = "Dolby_Headphones_smart_filter"
                filter.smart            = true
                filter.smart.name       = "Dolby_Headphones"
                priority.session        = -1
            }
            playback.props = {
                node.name       = "effect_output.Dolby_Headphones"
                node.passive    = true
                node.link-group = "Dolby_Headphones_smart_filter"
            }
        }
    }
]
