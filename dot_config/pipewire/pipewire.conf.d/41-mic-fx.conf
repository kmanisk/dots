# ==============================================================================
# 41-mic-fx.conf — Static Pitch & Formant Shift Microphone FX Filter Chain
# Separate source (ghelper-audio-fx), isolated from the primary clean mic path
#
# Pipeline Architecture:
#   ALC256 Hardware Mic
#        ↓ (node.passive = true)
#   Stage 1: 70 Hz Sub-Rumble High-Pass Filter (RBJ Biquad)
#        ↓
#   Stage 2: Real-time RNNoise Neural Network Noise Suppressor
#        ↓
#   Stage 3: Rubber Band Studio Pitch Shifter (-5 semitones deep voice)
#        ↓
#   Stage 4: LSP Studio True Peak Limiter Mono (Safety ceiling at -1 dBFS)
#        ↓
#   Virtual Source: ghelper-audio-fx (Audio/Source)
# ==============================================================================

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Dusky Mic (Pitch Shift FX)"
            media.name       = "Dusky Mic (Pitch Shift FX)"
            filter.graph = {
                nodes = [
                    # 1. 70 Hz Rumble Cut Highpass
                    {
                        type   = builtin
                        name   = hpf_70
                        label  = bq_highpass
                        control = { "Freq" = 70.0 "Q" = 0.707 }
                    }

                    # 2. Xiph RNNoise Real-Time Voice Noise Suppression
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"         = 50.0
                            "VAD Grace Period (ms)"      = 250.0
                            "Retroactive VAD Grace (ms)" = 100.0
                            "Dry Mix"                    = 0.0
                        }
                    }

                    # 3. Rubber Band Real-Time Pitch Shifter (-5 Semitones)
                    {
                        type   = ladspa
                        name   = pitch_shifter
                        plugin = "ladspa-rubberband"
                        label  = "rubberband-pitchshifter-mono"
                        control = {
                            "Semitones"          = -5.0
                            "Octaves"            = 0.0
                            "Cents"              = 0.0
                            "Crispness"          = 3.0
                            "Formant Preserving" = 0.0
                            "Wet-Dry Mix"        = 0.0
                        }
                    }

                    # 4. Studio Vocal Limiter (-1 dBFS peak guard)
                    {
                        type   = ladspa
                        name   = limiter
                        plugin = "lsp-plugins-ladspa"
                        label  = "http://lsp-plug.in/plugins/ladspa/limiter_mono"
                        control = {
                            "Threshold (G)"     = 0.891251
                            "Lookahead (ms)"    = 5.0
                            "Attack time (ms)"  = 5.0
                            "Release time (ms)" = 40.0
                        }
                    }
                ]
                links = [
                    { output = "hpf_70:Out"        input = "rnnoise:Input" }
                    { output = "rnnoise:Output"    input = "pitch_shifter:Input" }
                    { output = "pitch_shifter:Output" input = "limiter:Input" }
                ]
                inputs  = [ "hpf_70:In" ]
                outputs = [ "limiter:Output" ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "capture.ghelper-audio-fx"
                node.passive     = true
                target.object    = "alsa_input.pci-0000_00_1f.3.analog-stereo"
            }
            playback.props = {
                node.name        = "ghelper-audio-fx"
                node.description = "Dusky Mic (Pitch FX)"
                media.class      = "Audio/Source"
                audio.channels   = 1
                audio.position   = [ MONO ]
                priority.session = 2500
            }
        }
    }
]
