# ==============================================================================
# ~/.config/mpv/input.conf — Global Speed & YouTube Aligned Keybindings
# ==============================================================================

# --- Global Speed: Playback Speed (WASD Cluster) ---
w            set speed 1.0; script-binding uosc/flash-speed       # Normal speed (1.0x)
e            set speed 1.5; script-binding uosc/flash-speed       # 1.5x speed
a            set speed 1.75; script-binding uosc/flash-speed      # 1.75x speed
r            set speed 2.0; script-binding uosc/flash-speed       # 2.0x speed
d            add speed 0.25; script-binding uosc/flash-speed      # Increase speed (+0.25x)
E            add speed -0.05; script-binding uosc/flash-speed     # Fine speed decrease (-0.05x)
R            add speed 0.05; script-binding uosc/flash-speed      # Fine speed increase (+0.05x)
\            set speed 1.0; script-binding uosc/flash-speed       # Reset speed fallback

# --- Global Speed: Seeking & Navigation ---
z            seek -10; script-binding uosc/flash-timeline         # Rewind 10s
x            seek  10; script-binding uosc/flash-timeline         # Fast forward 10s
j            seek -10; script-binding uosc/flash-timeline         # YouTube/Global Speed rewind 10s
l            seek  10; script-binding uosc/flash-timeline         # YouTube/Global Speed fast forward 10s
,            seek  -5; script-binding uosc/flash-timeline         # Rewind 5s
.            seek   5; script-binding uosc/flash-timeline         # Fast forward 5s
LEFT         seek  -5; script-binding uosc/flash-timeline         # Rewind 5s
RIGHT        seek   5; script-binding uosc/flash-timeline         # Fast forward 5s
h            seek  -5; script-binding uosc/flash-timeline         # Vim fallback rewind 5s
Shift+LEFT   seek -30; script-binding uosc/flash-timeline         # Rewind 30s
Shift+RIGHT  seek  30; script-binding uosc/flash-timeline         # Fast forward 30s
H            seek -60; script-binding uosc/flash-timeline         # Rewind 60s
# --- YouTube Percentage Seeking (0-9, Numpad, Home/End) ---
0            seek   0 absolute-percent; script-binding uosc/flash-timeline  # Seek to 0% (start)
1            seek  10 absolute-percent; script-binding uosc/flash-timeline  # Seek to 10%
2            seek  20 absolute-percent; script-binding uosc/flash-timeline  # Seek to 20%
3            seek  30 absolute-percent; script-binding uosc/flash-timeline  # Seek to 30%
4            seek  40 absolute-percent; script-binding uosc/flash-timeline  # Seek to 40%
5            seek  50 absolute-percent; script-binding uosc/flash-timeline  # Seek to 50%
6            seek  60 absolute-percent; script-binding uosc/flash-timeline  # Seek to 60%
7            seek  70 absolute-percent; script-binding uosc/flash-timeline  # Seek to 70%
8            seek  80 absolute-percent; script-binding uosc/flash-timeline  # Seek to 80%
9            seek  90 absolute-percent; script-binding uosc/flash-timeline  # Seek to 90%
KP0          seek   0 absolute-percent; script-binding uosc/flash-timeline
KP1          seek  10 absolute-percent; script-binding uosc/flash-timeline
KP2          seek  20 absolute-percent; script-binding uosc/flash-timeline
KP3          seek  30 absolute-percent; script-binding uosc/flash-timeline
KP4          seek  40 absolute-percent; script-binding uosc/flash-timeline
KP5          seek  50 absolute-percent; script-binding uosc/flash-timeline
KP6          seek  60 absolute-percent; script-binding uosc/flash-timeline
KP7          seek  70 absolute-percent; script-binding uosc/flash-timeline
KP8          seek  80 absolute-percent; script-binding uosc/flash-timeline
KP9          seek  90 absolute-percent; script-binding uosc/flash-timeline
HOME         seek   0 absolute-percent; script-binding uosc/flash-timeline  # Jump to beginning (0%)
END          seek 100 absolute-percent; script-binding uosc/flash-timeline  # Jump to end (100%)
KP_HOME      seek   0 absolute-percent; script-binding uosc/flash-timeline
KP_END       seek 100 absolute-percent; script-binding uosc/flash-timeline
$            seek 100 absolute-percent                                      # Jump to end (100%)

# --- Global Speed: Pause & Playback Toggle ---
SPACE        cycle pause; script-binding uosc/flash-pause-indicator
k            cycle pause; script-binding uosc/flash-pause-indicator # YouTube/Global Speed pause
;            cycle pause; script-binding uosc/flash-pause-indicator # Global Speed semicolon pause
p            cycle pause; script-binding uosc/flash-pause-indicator # MPV fallback pause

# --- Global Speed: Volume Controls ---
[            add volume  5; script-binding uosc/flash-volume      # Volume +5%
'            add volume -5; script-binding uosc/flash-volume      # Volume -5%
UP           add volume  5; script-binding uosc/flash-volume      # Volume +5%
DOWN         add volume -5; script-binding uosc/flash-volume      # Volume -5%
m            no-osd cycle mute; script-binding uosc/flash-volume  # Mute toggle

# --- Global Speed: Window, Fullscreen & PiP ---
F            cycle fullscreen                                     # Global Speed Shift+F fullscreen
f            cycle fullscreen                                     # Fullscreen toggle
Alt+p        cycle ontop                                          # Global Speed Alt+P PiP toggle
T            cycle ontop                                          # Always on top toggle

# --- Global Speed: Open in Browser ---
`            run "xdg-open" "${path}"                             # Open stream in browser

# --- Playlists & Chapters ---
>            playlist-next
<            playlist-prev
J            add chapter  1; script-binding uosc/flash-timeline
K            add chapter -1; script-binding uosc/flash-timeline

# --- Looping ---
L            cycle-values loop-file "inf" "no"                    # Toggle loop current video
Ctrl+l       cycle-values loop-playlist "inf" "no"                # Toggle loop whole playlist

# --- Subtitles & Audio ---
c            cycle sub-visibility                                 # YouTube Captions: Toggle ON/OFF (c)
u            cycle sub                                            # Cycle next subtitle track
V            cycle sub-visibility
A            cycle audio
Ctrl+a       script-binding uosc/audio
Ctrl+s       script-binding uosc/subtitles
Ctrl+z       add sub-delay -0.1
Ctrl+Z       add sub-delay +0.1

# --- Frame Stepping ---
Ctrl+.       frame-step
Ctrl+,       frame-back-step

# --- UOSC UI & Utilities ---
s            screenshot
MENU         script-binding uosc/menu
MBTN_RIGHT   script-binding uosc/menu
TAB          script-binding uosc/toggle-ui
Ctrl+o       script-binding uosc/open-file
Ctrl+h       script-binding memo-history                          # Recent files & history menu
# script-binding memo-history #! History
b            script-binding sponsorblock                          # Toggle SponsorBlock on/off
Ctrl+r       script-binding reload/reload                         # Manual stream reload

# --- YouTube Tools (Download, Queue & Live Chat) ---
Ctrl+d       script-message-to youtube_download menu              # YouTube Download menu (Ctrl+D)
# script-message-to youtube_download menu                         #! YouTube > Download Video / Audio
Ctrl+v       script-binding mpv_youtube_queue/add_to_queue        # Queue: Add video URL from clipboard (Ctrl+V)
Ctrl+q       script-binding mpv_youtube_queue/print_queue         # Queue: Toggle interactive queue menu (Ctrl+Q)
# script-binding mpv_youtube_queue/print_queue                    #! YouTube > Queue: Show List
# script-binding mpv_youtube_queue/add_to_queue                   #! YouTube > Queue: Add from Clipboard
C            script-message load-chat                             # Live Chat: Fetch & load chat replay (Shift+C)
Alt+c        script-message chat-hidden                           # Live Chat: Toggle overlay visibility (Alt+c)
Alt+C        script-message chat-anchor                           # Live Chat: Cycle corner position (Alt+Shift+C)
# script-message load-chat                                        #! YouTube > Live Chat: Load Replay
# script-message chat-hidden                                      #! YouTube > Live Chat: Toggle Visibility
