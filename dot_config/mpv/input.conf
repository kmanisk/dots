# ==============================================================================
# ~/.config/mpv/input.conf — Global Speed & YouTube Aligned Keybindings
# ==============================================================================

# --- Global Speed: Playback Speed (WASD Cluster) ---
w            set speed 1.0; script-binding uosc/flash-speed       # Normal speed (1.0x)
e            set speed 1.5; script-binding uosc/flash-speed       # 1.5x speed
a            set speed 1.75; script-binding uosc/flash-speed      # 1.75x speed
r            set speed 2.0; script-binding uosc/flash-speed       # 2.0x speed
d            add speed 0.25; script-binding uosc/flash-speed      # Increase speed (+0.25x)
E            add speed -0.05; script-binding uosc/flash-speed     # Fine speed decrease (-0.05x)
R            add speed 0.05; script-binding uosc/flash-speed      # Fine speed increase (+0.05x)
\            set speed 1.0; script-binding uosc/flash-speed       # Reset speed fallback

# --- Global Speed: Seeking & Navigation ---
z            seek -10; script-binding uosc/flash-timeline         # Rewind 10s
x            seek  10; script-binding uosc/flash-timeline         # Fast forward 10s
j            seek -10; script-binding uosc/flash-timeline         # YouTube/Global Speed rewind 10s
l            seek  10; script-binding uosc/flash-timeline         # YouTube/Global Speed fast forward 10s
,            seek  -5; script-binding uosc/flash-timeline         # Rewind 5s
.            seek   5; script-binding uosc/flash-timeline         # Fast forward 5s
LEFT         seek  -5; script-binding uosc/flash-timeline         # Rewind 5s
RIGHT        seek   5; script-binding uosc/flash-timeline         # Fast forward 5s
h            seek  -5; script-binding uosc/flash-timeline         # Vim fallback rewind 5s
Shift+LEFT   seek -30; script-binding uosc/flash-timeline         # Rewind 30s
Shift+RIGHT  seek  30; script-binding uosc/flash-timeline         # Fast forward 30s
H            seek -60; script-binding uosc/flash-timeline         # Rewind 60s
L            seek  60; script-binding uosc/flash-timeline         # Fast forward 60s
0            seek 0 absolute; script-binding uosc/flash-timeline  # Restart video
$            seek 100 absolute-percent                            # Jump to end

# --- Global Speed: Pause & Playback Toggle ---
SPACE        cycle pause; script-binding uosc/flash-pause-indicator
k            cycle pause; script-binding uosc/flash-pause-indicator # YouTube/Global Speed pause
;            cycle pause; script-binding uosc/flash-pause-indicator # Global Speed semicolon pause
p            cycle pause; script-binding uosc/flash-pause-indicator # MPV fallback pause

# --- Global Speed: Volume Controls ---
[            add volume  5; script-binding uosc/flash-volume      # Volume +5%
'            add volume -5; script-binding uosc/flash-volume      # Volume -5%
UP           add volume  5; script-binding uosc/flash-volume      # Volume +5%
DOWN         add volume -5; script-binding uosc/flash-volume      # Volume -5%
m            no-osd cycle mute; script-binding uosc/flash-volume  # Mute toggle

# --- Global Speed: Window, Fullscreen & PiP ---
F            cycle fullscreen                                     # Global Speed Shift+F fullscreen
f            cycle fullscreen                                     # Fullscreen toggle
Alt+p        cycle ontop                                          # Global Speed Alt+P PiP toggle
T            cycle ontop                                          # Always on top toggle

# --- Global Speed: Open in Browser ---
`            run "xdg-open" "${path}"                             # Open stream in browser

# --- Playlists & Chapters ---
>            playlist-next
<            playlist-prev
J            add chapter  1; script-binding uosc/flash-timeline
K            add chapter -1; script-binding uosc/flash-timeline

# --- Subtitles & Audio ---
u            cycle sub
V            cycle sub-visibility
A            cycle audio
Ctrl+a       script-binding uosc/audio
Ctrl+s       script-binding uosc/subtitles
Ctrl+z       add sub-delay -0.1
Ctrl+Z       add sub-delay +0.1

# --- Frame Stepping ---
Ctrl+.       frame-step
Ctrl+,       frame-back-step

# --- UOSC UI & Utilities ---
s            screenshot
MENU         script-binding uosc/menu
MBTN_RIGHT   script-binding uosc/menu
TAB          script-binding uosc/toggle-ui
Ctrl+o       script-binding uosc/open-file
Ctrl+h       script-binding memo-history                          # Recent files & history menu
# script-binding memo-history #! History
b            script-binding sponsorblock                          # Toggle SponsorBlock on/off
Ctrl+r       script-binding reload/reload                         # Manual stream reload
