# --- General ---
keep-open=yes
save-position-on-quit=yes
autofit-larger=90%x90%

# --- UI / UOSC Requirements ---
osc=no
osd-bar=no
border=no

# --- Video (NVIDIA RTX 5050 discrete only, all launch paths) ---
vo=gpu
gpu-api=vulkan
gpu-context=waylandvk
vulkan-device="NVIDIA GeForce RTX 5050 Laptop GPU"

# --- Hardware Decoding (NVDEC on dGPU; -copy keeps subs/filters working) ---
hwdec=nvdec-copy

# --- Quality ---
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
dither-depth=auto

# --- Screenshots ---
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots

# --- Streaming & YouTube (1440p cap for 1200p panel + SponsorBlock + jitter cache) ---
ytdl-format="bestvideo[height<=?1440]+bestaudio/best"
ytdl-raw-options-append=sponsorblock-mark=all
cache=yes
demuxer-max-bytes=150M
demuxer-max-back-bytes=50M
demuxer-readahead-secs=20

# --- Thumbfast Worker Profile ---
[thumbfast]
audio=no
sub=no
video=no
hwdec=no 
profile=fast
