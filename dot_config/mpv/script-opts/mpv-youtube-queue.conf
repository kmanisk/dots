# mpv-youtube-queue configuration
# Clipboard paste into queue: Ctrl+V
add_to_queue=ctrl+v
print_queue=ctrl+q
remove_from_queue=ctrl+x
move_video=ctrl+m
move_cursor_down=ctrl+j
move_cursor_up=ctrl+k
play_selected_video=ctrl+ENTER
play_next_in_queue=ctrl+n
play_previous_in_queue=ctrl+p

# Disable commands that conflict with uosc / youtube-download
download_current_video=
download_selected_video=
open_video_in_browser=
open_channel_in_browser=
print_current_video=

# Environment & Wayland Clipboard
browser=xdg-open
clipboard_command=wl-paste
cursor_icon=>
display_limit=10
max_title_length=60
download_directory=~/Downloads
download_quality=best
downloader=curl
font_name=Iosevka Nerd Font
font_size=13
marked_icon=⇅
menu_timeout=8
show_errors=yes
ytdlp_file_format=mp4
ytdlp_output_template=%(title)s.%(ext)s
use_history_db=no
