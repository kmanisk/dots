# KEY BINDINGS (Scoped to avoid collision with uosc and mpv navigation)
download_video_binding=ctrl+d
download_audio_binding=ctrl+m
download_subtitle_binding=
download_video_embed_subtitle_binding=
select_range_binding=
download_mpv_playlist=

# Path to download files (matches system Downloads folder)
download_path=~/Downloads
filename=%(title)s.%(ext)s

# Formats & Quality
audio_format=mp3
audio_quality=0
embed_thumbnail=yes
audio_add_metadata=yes
video_add_metadata=yes
video_format=best

# Remux to mp4/mkv if needed
remux_video=mp4
restrict_filenames=no
