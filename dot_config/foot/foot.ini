# ===================================================================
# ~/.config/foot/foot.ini
# ===================================================================

# THEME & COLORS (Integrated with theme-set system engine)
include=~/.config/foot/foot-colors.ini

[main]
# Multi-threaded pixman rendering for client-server daemon mode
workers=4
# FONTS (Identical to Kitty & Alacritty: VictorMono Nerd Font Bold @ 19.5)
font=VictorMono Nerd Font:size=19.5:style=Bold
pad=0x0
resize-by-cells=no
initial-window-size-pixels=700x500

[scrollback]
# SCROLLBACK & HISTORY (Standard high-depth: 10,000 lines, memory efficient)
lines=10000

[cursor]
# CURSOR (Identical to Kitty & Alacritty: Block, blinking off)
style=block
blink=no

[mouse]
# Hide mouse cursor when typing
hide-when-typing=yes
alternate-scroll-mode=yes

[bell]
# Silence the terminal bell for true minimalism
urgent=no
notify=no
visual=no

[url]
# Open URLs with xdg-open
launch=xdg-open ${url}

[csd]
# Disable client-side decorations (Sway manages borders)
preferred=none

[key-bindings]
# Scrollback history navigation (instant native response, zero subprocess latency)
scrollback-up-line=Control+Shift+k Control+Mod1+k Mod1+Control+k Control+Alt+k Alt+Control+k
scrollback-down-line=Control+Shift+j Control+Mod1+j Mod1+Control+j Control+Alt+j Alt+Control+j
scrollback-up-half-page=Control+Shift+Page_Up Control+Mod1+Page_Up Mod1+Control+Page_Up Control+Alt+Page_Up Alt+Control+Page_Up
scrollback-down-half-page=Control+Shift+Page_Down Control+Mod1+Page_Down Mod1+Control+Page_Down Control+Alt+Page_Down Alt+Control+Page_Down

# KEYBINDINGS (Matching Kitty & Alacritty)
# Super+C / Super+V & Ctrl+Shift+C / Ctrl+Shift+V for Copy/Paste
clipboard-copy=Super+c Control+Shift+c XF86Copy
clipboard-paste=Super+v Control+Shift+v XF86Paste
primary-paste=Shift+Insert

# Alt+Shift+U / Alt+Shift+Y & Alt+Shift+= / Alt+Shift+- for font size zoom
font-increase=Alt+Shift+u Alt+Shift+equal Control+plus Control+equal Control+KP_Add
font-decrease=Alt+Shift+y Alt+Shift+minus Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
