# ==============================================================================
# 10-display.conf — Output, Cursor, Borders & Theme Colors
# ==============================================================================

# Output Configuration (Internal Display @ 165Hz, Native 1:1 hardware pixels)
# Locked 165Hz tear-free presentation: adaptive_sync off prevents LCD voltage/gamma
# fluctuation and corner backlight flickering on high-refresh laptop panels.
output eDP-1 {
    mode 1920x1200@165Hz
    scale 1.0
    adaptive_sync off
    allow_tearing yes
    max_render_time off
    background #1d2021 solid_color
}

output eDP-2 {
    mode 1920x1200@165.004Hz
    scale 1.0
    adaptive_sync off
    allow_tearing yes
    max_render_time off
    background #1d2021 solid_color
}

# Cursor: explicit theme + size (40)
seat seat0 xcursor_theme phinger-cursors-gruvbox-material-light 40

# Window Borders
default_border pixel 2
default_floating_border pixel 2

# Hide outer edge borders when tabs/windows fill the edge
hide_edge_borders --i3 smart

# Dynamic Theme Colors (NvChad base46 palette)
include ~/.local/state/theme/sway.conf

# Re-apply mode-aware hardware vibrance on session start & sway reload
exec_always --no-startup-id ~/.local/bin/apply-vibrance
