# ==============================================================================
# 30-window-rules.conf — Window Assignments, Floating Rules & Layout Defaults
# ==============================================================================

# ------------------------------------------------------------------------------
# Workspace Layout Defaults
# ------------------------------------------------------------------------------
# Every workspace starts tabbed. (2026-10-18)
# Note: `workspace N layout tabbed` is not a valid sway command — the trailing
# words were parsed as part of the workspace *name* and never set any layout.
# The per-window `for_window [workspace=...] layout tabbed` rules that used to
# enforce this on ws1-3 were removed 2026-10-17.
workspace_layout tabbed

# ------------------------------------------------------------------------------
# General Utilities, Dialogs & Floating Windows
# ------------------------------------------------------------------------------
for_window [app_id="(?i)^dusky_audio_studio.*"] floating enable, move position center
for_window [title="Timer"] floating enable
for_window [app_id="imv"] floating enable, move position center, focus
for_window [class="imv"] floating enable, move position center, focus
for_window [app_id="zenity"] floating enable
for_window [class="zenity"] floating enable
for_window [app_id="cachyos-welcome"] floating enable
for_window [class="cachyos-welcome"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [class="pavucontrol"] floating enable
for_window [app_id="wifui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [class="wifui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [app_id="bluetui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [class="bluetui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [app_id="rogtui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [class="rogtui"] floating enable, border pixel 2, resize set 1200 800, move position center, focus
for_window [app_id="youtube-tui"] floating enable, border pixel 2, resize set 1400 900, move position center, focus
for_window [class="youtube-tui"] floating enable, border pixel 2, resize set 1400 900, move position center, focus
for_window [app_id="concord-term"] floating enable, resize set 1200 800, move position center, focus
for_window [class="concord-term"] floating enable, resize set 1200 800, move position center, focus
for_window [app_id="tgt-term"] floating enable, border pixel 2, resize set 1300 850, move position center, focus
for_window [class="tgt-term"] floating enable, border pixel 2, resize set 1300 850, move position center, focus
for_window [app_id="clip-term"] floating enable, border pixel 3, resize set 1500 860, move position center, focus
for_window [class="clip-term"] floating enable, border pixel 3, resize set 1500 860, move position center, focus
for_window [app_id="rofi"] floating enable, move position center, focus
for_window [class="rofi"] floating enable, move position center, focus
for_window [app_id="blueman-manager"] floating disable
for_window [class="blueman-manager"] floating disable
for_window [app_id="(?i)^goverlay$"] floating disable, focus
for_window [class="(?i)^goverlay$"] floating disable, focus
for_window [app_id="(?i)^nvidia-settings$"] floating enable, move position center
for_window [class="(?i)^nvidia-settings$"] floating enable, move position center
for_window [app_id="(?i)^btop$"] floating enable, resize set 1820 1100, move position center
for_window [class="(?i)^btop$"] floating enable, resize set 1820 1100, move position center
for_window [app_id="(?i)^Task Manager TMOG$"] floating enable, resize set 1820 1100, move position center
for_window [class="(?i)^Task Manager TMOG$"] floating enable, resize set 1820 1100, move position center
for_window [instance="(?i)^AppRun\.wrapped$"] floating enable, resize set 1200 750, move position center
for_window [instance="(?i)^pkg-float$"] floating enable, resize set 1250 780, move position center
for_window [app_id="(?i)^pkg-float$"] floating enable, resize set 1250 780, move position center
for_window [app_id="(?i)^lsfg-vk-ui$"] floating enable, resize set 1250 820, move position center
for_window [class="(?i)^lsfg-vk-ui$"] floating enable, resize set 1250 820, move position center
for_window [app_id="(?i)^vkcube.*"] floating enable, resize set 900 650, move position center
for_window [class="(?i)^vkcube.*"] floating enable, resize set 900 650, move position center
for_window [app_id="(?i)^peazip.*"] floating enable
for_window [class="(?i)^peazip.*"] floating enable
for_window [app_id="(?i)^io\.github\.amethyst\.modmanager$"] floating enable, move position center, focus
for_window [class="(?i)^io\.github\.amethyst\.modmanager$"] floating enable, move position center, focus

# ------------------------------------------------------------------------------
# Waydroid (Android container UI opens on current workspace, focused)
# ------------------------------------------------------------------------------
for_window [app_id="^Waydroid$"] focus

# ------------------------------------------------------------------------------
# Desktop Portal, File Chooser & Dialog rules
# ------------------------------------------------------------------------------
for_window [app_id="(?i)xdg-desktop-portal.*"] floating enable, move position center
for_window [app_id="(?i)portal"] floating enable, move position center
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [title="(?i)browse"] floating enable, move position center
for_window [title="(?i)select a file"] floating enable, move position center
for_window [title="(?i)choose an application"] floating enable, move position center
for_window [title="(?i)open file"] floating enable, move position center
for_window [app_id="(?i)^me3-manager$"] floating enable, resize set 1280 800, move position center

# Screen Sharing Indicator Bar (Brave / Chrome / Discord / Element / Meet)
# The "Hide" button fails on Linux because Sway has no minimize state.
# Auto-banish to scratchpad so it never obstructs the screen or presentation.
for_window [title="(?i).*(is sharing (your screen|a window)|sharing your screen).*"] floating enable, move to scratchpad

# ------------------------------------------------------------------------------
# Thunar Dialog Rules (Floating dialogs, never swallowed into tabbed layout)
# ------------------------------------------------------------------------------
for_window [app_id="(?i)^thunar$" title="(?i)^Rename.*"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Rename.*"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^Create.*"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Create.*"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^File Operation Progress$"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^File Operation Progress$"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^Confirm.*"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Confirm.*"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^Preferences$"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Preferences$"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^Properties.*"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Properties.*"] floating enable
for_window [app_id="(?i)^thunar$" title="(?i)^Attention$"] floating enable
for_window [class="(?i)^thunar$" title="(?i)^Attention$"] floating enable
for_window [app_id="(?i)^thunar$" window_type="dialog"] floating enable
for_window [class="(?i)^thunar$" window_type="dialog"] floating enable

# ------------------------------------------------------------------------------
# Web Browser Rules (Workspace 2) + Video Player (current workspace)
# ------------------------------------------------------------------------------
for_window [app_id="(?i)^brave(-browser|-origin)?$"] floating disable
for_window [app_id="(?i)^org\.qutebrowser\.qutebrowser$"] floating disable
for_window [app_id="(?i)^qutebrowser$"] floating disable
for_window [class="(?i)^qutebrowser$"] floating disable
assign [app_id="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha|qutebrowser|org\.qutebrowser\.qutebrowser)$"] workspace number $ws2
assign [class="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha|qutebrowser|org\.qutebrowser\.qutebrowser)$"] workspace number $ws2

for_window [app_id="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha|qutebrowser|org\.qutebrowser\.qutebrowser)$"] move to workspace number $ws2, floating disable, layout tabbed
for_window [class="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha|qutebrowser|org\.qutebrowser\.qutebrowser)$"] move to workspace number $ws2, floating disable, layout tabbed

# Video player (mpv) opens tiled on the current workspace where launched.
# It follows the container layout, so on a tabbed container it becomes a tab.
for_window [app_id="(?i)^(mpv|vlc|celluloid|totem|amberol|audacious|spotify)$"] floating disable, move to workspace current, focus
for_window [class="(?i)^(mpv|vlc|celluloid|totem|amberol|audacious|spotify)$"] floating disable, move to workspace current, focus

# Browser popups, web app dialogs float on ws2
for_window [app_id="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha)$" window_role="pop-up"] floating enable, move position center
for_window [app_id="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha)$" window_role="bubble"] floating enable, move position center
for_window [app_id="(?i)^(brave|brave-browser|brave-origin|firefox|librewolf|zen-alpha)$" window_type="dialog"] floating enable, move position center
# No catch-all float rule for brave-* here on purpose. The former rule
# [app_id="(?i)^brave-(?!origin$).+"] matched every Brave window that was not
# exactly "brave-origin" (PWA and app windows included) and floated it at map
# time, centered. Main browser windows stay tiled; real popups are already
# covered by the window_role/window_type rules above.

# Document reader (zathura) opens on current workspace, floating, centered, focused
for_window [app_id="(?i)^(org\.pwmt\.zathura|zathura)$"] floating enable, border pixel 2, resize set 1400 1000, move position center, focus
for_window [class="(?i)^(org\.pwmt\.zathura|zathura)$"] floating enable, border pixel 2, resize set 1400 1000, move position center, focus

# Picture-in-Picture floats cleanly and stays visible across workspaces
for_window [title="(?i)picture[- ]in[- ]picture"] floating enable, sticky enable

# ------------------------------------------------------------------------------
# Steam & Steam Dialog Rules (Workspace 3)
# ------------------------------------------------------------------------------
assign [class="(?i)^steam$"] workspace number $ws3
assign [app_id="(?i)^steam$"] workspace number $ws3
assign [instance="(?i)^steam.*$"] workspace number $ws3

for_window [class="(?i)^steam$" title="^(?!.*(Grand Theft Auto|GTA|Rockstar|ELDEN RING|Elden Ring|Dark Souls)).*$"] move to workspace number $ws3
for_window [instance="(?i)^steam.*$" title="^(?!.*(Grand Theft Auto|GTA|Rockstar|ELDEN RING|Elden Ring|Dark Souls)).*$"] move to workspace number $ws3
for_window [class="(?i)^steam$" title="^Steam$"] floating disable
for_window [instance="steamwebhelper" title="^Steam$"] floating disable
for_window [class="(?i)^steam$" title="^Settings$"] move to workspace number $ws3, floating disable
for_window [class="(?i)^steam$" title=".*[Pp]roperties.*"] move to workspace number $ws3, floating disable
for_window [class="(?i)^steam$" title="^Add Non-Steam Game$"] move to workspace number $ws3, floating disable
for_window [instance="steamwebhelper" title="^Add Non-Steam Game$"] move to workspace number $ws3, floating disable

for_window [class="(?i)^steam$" window_type="dialog"] move to workspace number $ws3, floating enable, move position center
for_window [class="(?i)^steam$" window_role="dialog"] move to workspace number $ws3, floating enable, move position center
for_window [class="(?i)^steam$" window_role="pop-up"] move to workspace number $ws3, floating enable, move position center
for_window [class="(?i)^steam$" window_type="menu"] floating enable
for_window [class="(?i)^steam$" window_type="popup_menu"] floating enable
for_window [class="(?i)^steam$" window_type="dropdown_menu"] floating enable
for_window [class="(?i)^steam$" window_type="tooltip"] floating enable
for_window [class="(?i)^steam$" window_type="utility"] floating enable
for_window [class="(?i)^steam$" window_type="notification"] floating enable
for_window [class="(?i)^steam$" title="(?i).*(launch option|launch options|choose an option|news|updater|guard|screenshot|cd key|install).*"] move to workspace number $ws3, floating enable, move position center

# Friends List & chat popups — explicitly float, size, and focus them
for_window [class="(?i)^steam$" title="^Friends List$"] move to workspace number $ws3, floating enable, resize set 360 700, focus
for_window [instance="steamwebhelper" title="^Friends List$"] move to workspace number $ws3, floating enable, resize set 360 700, focus
for_window [instance="steamwebhelper" title=".* - Chat$"] move to workspace number $ws3, floating enable, resize set 760 520, move position center, focus
for_window [class="(?i)^steam$" title="(?i)^send message.*|^chat with.*"] move to workspace number $ws3, floating enable, resize set 760 520, move position center, focus

# ------------------------------------------------------------------------------
# Gaming Rules (Workspace 4: Fullscreen, Low Latency Tearing, Inhibitors)
# Strictly match executable class / app_id / instance.
# NEVER match bare window titles so media players (mpv/vlc), browsers, audio
# apps, document viewers, and editors are NEVER swept to ws4.
# ------------------------------------------------------------------------------
# Fullscreen idle inhibition (media players, browser fullscreen video, presentations)
for_window [all] inhibit_idle fullscreen
for_window [workspace="^4$"] inhibit_idle visible

# Steam games (native or Proton always set steam_app_<appid>)
assign [class="^steam_app_.*$"] workspace number $ws4
assign [app_id="^steam_app_.*$"] workspace number $ws4
assign [instance="^steam_app_.*$"] workspace number $ws4
for_window [class="^steam_app_.*$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus
for_window [app_id="^steam_app_.*$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus
for_window [instance="^steam_app_.*$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus

# Gamescope wrapper & direct Proton/Wine/native game executables
assign [class="(?i)^(cs2|gamescope|steam_proton|eldenring(\.exe)?|darksouls.*(\.exe)?|playgtaiv(\.exe)?|gtaiv(\.exe)?|sekiro(\.exe)?|farcry.*(\.exe)?|dyinglight.*(\.exe)?|hll.*(\.exe)?|hellletloose.*(\.exe)?|armoredcore.*(\.exe)?)$"] workspace number $ws4
assign [app_id="(?i)^(cs2|gamescope|steam_proton|eldenring(\.exe)?|darksouls.*(\.exe)?|playgtaiv(\.exe)?|gtaiv(\.exe)?|sekiro(\.exe)?|farcry.*(\.exe)?|dyinglight.*(\.exe)?|hll.*(\.exe)?|hellletloose.*(\.exe)?|armoredcore.*(\.exe)?)$"] workspace number $ws4
assign [instance="(?i)^(cs2|gamescope|steam_proton|eldenring(\.exe)?|darksouls.*(\.exe)?|playgtaiv(\.exe)?|gtaiv(\.exe)?|sekiro(\.exe)?|farcry.*(\.exe)?|dyinglight.*(\.exe)?|hll.*(\.exe)?|hellletloose.*(\.exe)?|armoredcore.*(\.exe)?)$"] workspace number $ws4
for_window [class="(?i)^(cs2|gamescope|steam_proton|eldenring(\.exe)?|darksouls.*(\.exe)?|playgtaiv(\.exe)?|gtaiv(\.exe)?|sekiro(\.exe)?|farcry.*(\.exe)?|dyinglight.*(\.exe)?|hll.*(\.exe)?|hellletloose.*(\.exe)?|armoredcore.*(\.exe)?)$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus
for_window [app_id="(?i)^(cs2|gamescope|eldenring(\.exe)?|steam_proton|farcry.*|gtaiv.*|dyinglight.*|hll.*|hellletloose.*|darksouls.*)(\.exe)?$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus
for_window [instance="(?i)^(cs2|gamescope|steam_proton|eldenring(\.exe)?|darksouls.*(\.exe)?|playgtaiv(\.exe)?|gtaiv(\.exe)?|sekiro(\.exe)?|farcry.*(\.exe)?|dyinglight.*(\.exe)?|hll.*(\.exe)?|hellletloose.*(\.exe)?|armoredcore.*(\.exe)?)$"] move to workspace number $ws4, fullscreen enable, allow_tearing yes, shortcuts_inhibitor enable, inhibit_idle focus

# DS3 / Game Modding Utilities — float, disable fullscreen, and open on current workspace
for_window [app_id="(?i)^(leshade|me3-manager)$"] floating enable, move position center
for_window [class="(?i)^(leshade|me3-manager|ds3randomizer(\.exe)?)$"] floating enable, move position center
for_window [instance="(?i)^(leshade|me3-manager|ds3randomizer(\.exe)?)$"] floating enable, move position center

# Rockstar launcher helpers (float on ws4 without focus stealing)
assign [class="(?i)^(launcher\.exe|socialclubhelper\.exe)$"] workspace number $ws4
assign [instance="(?i)^(launcher\.exe|socialclubhelper\.exe)$"] workspace number $ws4
for_window [class="(?i)^(launcher\.exe|socialclubhelper\.exe)$"] move to workspace number $ws4, floating enable
for_window [instance="(?i)^(launcher\.exe|socialclubhelper\.exe)$"] move to workspace number $ws4, floating enable
no_focus [class="(?i)^(launcher\.exe|socialclubhelper\.exe)$"]
no_focus [instance="(?i)^(launcher\.exe|socialclubhelper\.exe)$"]

# ------------------------------------------------------------------------------
# Scratchpad Window Rules (Floating & centered, auto-hidden, visible border)
# Geometry matches canonical size in scratch-toggle: 1700 1050
# ------------------------------------------------------------------------------
for_window [floating] border pixel 2
for_window [app_id="scratch-term"] floating enable, border pixel 2, resize set 1700 1050, move position center, move to scratchpad
for_window [instance="scratch-term"] floating enable, border pixel 2, resize set 1700 1050, move position center, move to scratchpad
for_window [app_id="scratch-notes"] floating enable, border pixel 2, resize set 1700 1050, move position center, move to scratchpad
for_window [instance="scratch-notes"] floating enable, border pixel 2, resize set 1700 1050, move position center, move to scratchpad
for_window [class="(?i)spotify"] floating enable, border pixel 2, resize set 1700 1050, move position center, move to scratchpad
