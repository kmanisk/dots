# ==============================================================================
# 60-autostart.conf — Background Services, Daemons, Environment & Scratchpads
# ==============================================================================

# Session Environment Variables (D-Bus & Systemd user session)
exec_always --no-startup-id sh -c "export QT_QPA_PLATFORMTHEME=\"qt5ct:qt6ct\"; systemctl --user import-environment QT_QPA_PLATFORMTHEME 2>/dev/null; dbus-update-activation-environment --systemd QT_QPA_PLATFORMTHEME 2>/dev/null"
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP=sway SWAYSOCK QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE XCURSOR_PATH WLR_NO_HARDWARE_CURSORS
exec systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE XCURSOR_PATH WLR_NO_HARDWARE_CURSORS
exec_always --no-startup-id systemctl --user restart cliphist.service
exec_always --no-startup-id systemctl --user start foot-server.socket
exec_always --no-startup-id systemctl --user start xscroll.service
exec_always --no-startup-id xrdb -merge "$HOME/.Xresources"
exec_always --no-startup-id ~/.local/bin/ensure-xcursor-fallbacks

# Favorites in the Fuzzel launcher (generated from ~/.config/rofi/favorites.list)
exec_always --no-startup-id ~/.local/bin/sync-fuzzel-favorites

# Notification Daemon
exec --no-startup-id mako

# One-shot session restore (bounded IPC wait, exits immediately, no daemon)
exec --no-startup-id ~/.local/bin/sway-session-restore --all --quiet --wait-ready

# Night Light auto scheduler
exec --no-startup-id ~/.local/bin/toggle-nightlight --auto --silent

# Polkit authentication agent (for GUI privilege elevation)
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Game workspace backstop: moves late-class game windows (Rockstar/CEF) to ws4
exec_always --no-startup-id ~/.local/bin/game-workspace-daemon

# Wallpaper restoration
exec_always --no-startup-id sh -c '[ -f "$HOME/.config/current_wallpaper" ] && swaymsg output "*" bg "$(cat "$HOME/.config/current_wallpaper")" fill'

# Idle Management (swayidle) & Keep-Awake
# Initialized active by default with screen dimming (no locking, lid keeps awake)
exec_always --no-startup-id ~/.local/bin/keep-awake init

# Auto-connect Katana Bluetooth Keyboard on session start
exec --no-startup-id ~/.local/bin/bt-katana >/dev/null 2>&1 &
