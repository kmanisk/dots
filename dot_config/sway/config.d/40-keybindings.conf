# ==============================================================================
# 40-keybindings.conf — Core Window Management, Navigation, Launchers & Media
# ==============================================================================

# ------------------------------------------------------------------------------
# Terminal & Application Launchers
# ------------------------------------------------------------------------------
bindsym Mod1+Return exec $term
# $mod+Return intentionally unbound (was a duplicate of Mod1+Return)

# App Launchers (Native Layer-Shell Fuzzel)
bindsym Mod1+space exec "pkill fuzzel || fuzzel"

# Web Search with bangs (Google, YouTube, ArchWiki, GitHub, Amazon)
bindsym Mod1+s exec --no-startup-id ~/.local/bin/rofi-websearch
bindsym $mod+slash exec --no-startup-id ~/.local/bin/rofi-websearch

# Clipboard Management
bindsym $mod+v exec --no-startup-id ~/.local/bin/rofi-clipboard
bindsym $mod+Shift+v exec --no-startup-id ~/.local/bin/rofi-clipboard

# Browser Launchers
bindsym $mod+b exec --no-startup-id brave-origin
bindsym $mod+Shift+b split h

# Wallpaper
bindsym $mod+Shift+w exec --no-startup-id ~/.local/bin/ds3-wallpaper
bindsym Mod1+Shift+w exec --no-startup-id ~/.local/bin/ds3-wallpaper

# Text Editor & File Manager
bindsym $mod+Shift+t exec footclient -o font="Iosevka Nerd Font Mono:size=22:style=Regular" nvim
bindsym Mod1+Shift+m exec --no-startup-id ~/.local/bin/rofi-theme
bindsym $mod+e exec thunar ~
bindsym $mod+z exec --no-startup-id zed
bindsym $mod+Mod1+c exec footclient --app-id=concord-term -o font="Iosevka Nerd Font Mono:size=13.0:style=Regular" concord


# Process Killer & System Menus — Alt+Esc chord removed (xremap caps+w covers it)
bindsym $mod+Escape exec --no-startup-id ~/.local/bin/powermenu

# Games Launcher
bindsym Mod1+g exec --no-startup-id ~/.local/bin/rofi-games
# Steam (DGPU) - background launch, window routed to ws3 (no view switch)
bindsym $mod+Shift+g exec --no-startup-id "prime-run ~/.local/bin/steam-workspace"

# OBS Studio Hotkeys (Alt + Shift + R to Start, Alt + Shift + X to Stop)
bindsym --to-code Mod1+Shift+r exec --no-startup-id obs --startrecording
bindsym --to-code Mod1+Shift+x exec --no-startup-id obs --stoprecording

# MangoHud 3D Preview Toggle (Alt + m)
bindsym Mod1+m exec --no-startup-id ~/.local/bin/hudtest

# Spotify scratchpad
bindsym --no-repeat $mod+m exec --no-startup-id ~/.local/bin/scratch-toggle spotify

# Task Manager (btop in floating window) — chords removed 2026-10-18 per audit

# ------------------------------------------------------------------------------
# System Utilities & Controls
# ------------------------------------------------------------------------------
bindsym $mod+Mod1+1 exec --no-startup-id footclient --app-id=wifui $HOME/.cargo/bin/wifui
bindsym $mod+Mod1+2 exec --no-startup-id footclient --app-id=bluetui bluetui
bindsym $mod+Mod1+3 exec pavucontrol
bindsym $mod+Mod1+4 exec --no-startup-id footclient --app-id=rogtui rogtui
bindsym $mod+Mod1+o exec --no-startup-id ~/.local/bin/rofi-speaker-dsp
bindsym $mod+Mod1+5 exec --no-startup-id ~/.local/bin/rofi-network
bindsym --to-code Mod1+Shift+o exec --no-startup-id ~/.local/bin/toggle-audio-sink
bindsym $mod+Control+m exec --no-startup-id ~/.local/bin/toggle-headset-mic

# Bluetooth: toggle auto-connect refusal for the soundcore Q20i (Win+Shift+Enter)
bindsym $mod+Shift+Return exec --no-startup-id ~/.local/bin/bt-refuse-toggle

# Toggle Bottom Bar (Alt + 0)
bindsym Mod1+0 exec --no-startup-id ~/.local/bin/toggle-bar

# Night Light Controls
bindsym Mod1+Shift+n exec --no-startup-id ~/.local/bin/toggle-nightlight
bindsym Mod1+Shift+bracketleft exec --no-startup-id ~/.local/bin/adjust-nightlight +100
bindsym Mod1+Shift+bracketright exec --no-startup-id ~/.local/bin/adjust-nightlight -100
bindsym Mod1+Shift+braceleft exec --no-startup-id ~/.local/bin/adjust-nightlight +100
bindsym Mod1+Shift+braceright exec --no-startup-id ~/.local/bin/adjust-nightlight -100
bindsym Control+Shift+apostrophe exec --no-startup-id ~/.local/bin/adjust-nightlight -100
bindsym Control+Shift+quotedbl exec --no-startup-id ~/.local/bin/adjust-nightlight -100
bindsym Control+Shift+semicolon exec --no-startup-id ~/.local/bin/adjust-nightlight +100
bindsym Control+Shift+colon exec --no-startup-id ~/.local/bin/adjust-nightlight +100
bindsym Mod1+Shift+apostrophe exec --no-startup-id ~/.local/bin/adjust-nightlight -100
bindsym Mod1+Shift+quotedbl exec --no-startup-id ~/.local/bin/adjust-nightlight -100

# Cursor Theme & Size Controls
bindsym Mod1+Shift+c exec --no-startup-id ~/.local/bin/toggle-cursor-theme
bindsym Mod1+Shift+equal exec --no-startup-id ~/.local/bin/adjust-cursor-size +4
bindsym Mod1+Shift+minus exec --no-startup-id ~/.local/bin/adjust-cursor-size -4
bindsym Mod1+Shift+plus exec --no-startup-id ~/.local/bin/adjust-cursor-size +4
bindsym Mod1+Shift+underscore exec --no-startup-id ~/.local/bin/adjust-cursor-size -4

# Screen Brightness (Hardware keys & xremap)
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.local/bin/change-brightness +5%
bindsym --inhibited XF86MonBrightnessUp exec --no-startup-id ~/.local/bin/change-brightness +5%
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.local/bin/change-brightness 5%-
bindsym --inhibited XF86MonBrightnessDown exec --no-startup-id ~/.local/bin/change-brightness 5%-

# Keyboard Backlight & ROG Aura RGB Controls (Hardware keys & 60% board chords)
bindsym XF86KbdBrightnessUp exec --no-startup-id rogtui aura brightness up
bindsym --inhibited XF86KbdBrightnessUp exec --no-startup-id rogtui aura brightness up
bindsym XF86KbdBrightnessDown exec --no-startup-id rogtui aura brightness down
bindsym --inhibited XF86KbdBrightnessDown exec --no-startup-id rogtui aura brightness down
bindsym XF86Launch4 exec --no-startup-id rogtui aura next-mode
bindsym --inhibited XF86Launch4 exec --no-startup-id rogtui aura next-mode
bindsym Shift+XF86Launch4 exec --no-startup-id rogtui aura next-preset
bindsym --inhibited Shift+XF86Launch4 exec --no-startup-id rogtui aura next-preset

# Aura RGB Chords (60% Ergonomic Chords: Super+Alt)
bindsym $mod+Mod1+m exec --no-startup-id rogtui aura next-mode
bindsym $mod+Mod1+Shift+m exec --no-startup-id rogtui aura prev-mode
bindsym $mod+Mod1+p exec --no-startup-id rogtui aura next-preset
bindsym $mod+Mod1+Shift+p exec --no-startup-id rogtui aura prev-preset
bindsym $mod+Mod1+b exec --no-startup-id rogtui aura toggle

# Audio Volume & Mute (Hardware keys & xremap)
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.local/bin/volume-notify up
bindsym --inhibited XF86AudioRaiseVolume exec --no-startup-id ~/.local/bin/volume-notify up
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.local/bin/volume-notify down
bindsym --inhibited XF86AudioLowerVolume exec --no-startup-id ~/.local/bin/volume-notify down
bindsym XF86AudioMute exec --no-startup-id ~/.local/bin/volume-notify mute
bindsym --inhibited XF86AudioMute exec --no-startup-id ~/.local/bin/volume-notify mute
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindsym --inhibited XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Screenshots (kept: Win+S region -> clipboard, Win+Shift+S OCR snip; Caps layer holds Caps+s / Caps+Space)
bindsym $mod+s exec --no-startup-id ~/.local/bin/screenshot-region
bindsym $mod+Shift+s exec --no-startup-id ~/.local/bin/ocr-snip

# Screen Lock
bindsym $mod+Control+l exec swaylock -f -c 000000

# ------------------------------------------------------------------------------
# Window Management & Navigation
# ------------------------------------------------------------------------------
# Close & Force Kill — per audit: Win+Q polite close, Win+BackSpace force quit
bindsym $mod+q kill
bindsym $mod+BackSpace exec --no-startup-id ~/.local/bin/force-kill-window

# Layout & Tiling
bindsym $mod+f fullscreen toggle
# Browsers are never floated: the helper re-tiles them instead of toggling.
# sway cannot scope a chord by app_id (bindsym has no criteria) and for_window
# runs once per window, so this guard is the only place the rule can hold.
bindsym Mod1+Shift+space exec --no-startup-id ~/.local/bin/toggle-floating-strict
# Unconditional escape hatch: force the focused window back into the tiling layer.
bindsym $mod+Shift+space floating disable
bindsym Shift+space exec --no-startup-id ~/.local/bin/toggle-floating-focus
bindsym $mod+space exec --no-startup-id ~/.local/bin/toggle-scratch-focus
bindsym $mod+Shift+a focus parent
bindsym $mod+w layout tabbed
bindsym $mod+semicolon exec --no-startup-id ~/.local/bin/smart-layout-toggle


# Focus Navigation (hjkl & arrows)
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move Containers (hjkl & arrows)
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# ------------------------------------------------------------------------------
# Workspace Management
# ------------------------------------------------------------------------------
# Top-Row Right-Hand Workspace Switching (Windows + u i o p)
bindsym --inhibited $mod+u workspace number $ws1
bindsym --inhibited $mod+i workspace number $ws2
bindsym --inhibited $mod+o workspace number $ws3
bindsym --inhibited $mod+p workspace number $ws4

# Top-Row Right-Hand Move Window + follow (Windows + Shift + u i o p)
bindsym $mod+Shift+u move container to workspace number $ws1; workspace number $ws1
bindsym $mod+Shift+i move container to workspace number $ws2; workspace number $ws2
bindsym $mod+Shift+o move container to workspace number $ws3; workspace number $ws3
bindsym $mod+Shift+p move container to workspace number $ws4; workspace number $ws4

# Bracket-row Workspaces 5 & 6
bindsym $mod+bracketleft workspace number $ws5
bindsym $mod+bracketright workspace number $ws6
bindsym $mod+Shift+braceleft move container to workspace number $ws5; workspace number $ws5
bindsym $mod+Shift+braceright move container to workspace number $ws6; workspace number $ws6

# Standard Number Workspace Switching
bindsym --inhibited $mod+1 workspace number $ws1
bindsym --inhibited $mod+2 workspace number $ws2
bindsym --inhibited $mod+3 workspace number $ws3
bindsym --inhibited $mod+4 workspace number $ws4
bindsym --inhibited $mod+5 workspace number $ws5
bindsym --inhibited $mod+6 workspace number $ws6
bindsym --inhibited $mod+7 workspace number $ws7
bindsym --inhibited $mod+8 workspace number $ws8
bindsym --inhibited $mod+9 workspace number $ws9
bindsym --inhibited $mod+0 workspace number $ws10

# Move Window to Workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# Workspace toggling (explicit back_and_forth via Win+Tab, no auto toggle on Win+1/2)
workspace_auto_back_and_forth no
bindsym $mod+Tab workspace back_and_forth
bindsym $mod+grave exec --no-startup-id ~/.local/bin/ws-toggle-2-4
bindsym $mod+comma workspace prev
bindsym $mod+period workspace next
bindsym $mod+Shift+comma move container to workspace prev; workspace prev
bindsym $mod+Shift+period move container to workspace next; workspace next

# ------------------------------------------------------------------------------
# Scratchpad Toggles
# ------------------------------------------------------------------------------
bindsym --no-repeat Control+space exec --no-startup-id env SCRATCH_GAME_GUARD=1 ~/.local/bin/scratch-toggle term
bindsym --no-repeat $mod+n exec --no-startup-id ~/.local/bin/scratch-toggle notes
bindsym --no-repeat $mod+minus [app_id="(?i)mpv"] scratchpad show
bindsym --no-repeat $mod+underscore [app_id="(?i)mpv"] scratchpad show

# ------------------------------------------------------------------------------
# Session Control
# ------------------------------------------------------------------------------
bindsym $mod+Shift+r reload
