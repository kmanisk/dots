# ==============================================================================
# 45-ui-scale.conf - Central UI scaling (all GUI apps)
# ==============================================================================
# Sway scales at the output level, not per window. These binds change the scale
# of every active output, which every Wayland client follows, and write the
# result to config.d/99-ui-scale.conf so Sway restores it on reload and login.
#
#   $mod+Alt+=        (and $mod+Alt+Shift+=)   zoom in   (+5%)
#   $mod+Alt+-        (and $mod+Alt+Shift+-)   zoom out  (-5%)
#   $mod+Alt+0                                 reset to 1.00x
#
# Range is clamped to 0.75x-2.00x. Restore command: ui-scale apply
# ==============================================================================

bindsym --no-repeat $mod+Mod1+equal      exec --no-startup-id ~/.local/bin/ui-scale in
bindsym --no-repeat $mod+Mod1+plus       exec --no-startup-id ~/.local/bin/ui-scale in
bindsym --no-repeat $mod+Mod1+minus      exec --no-startup-id ~/.local/bin/ui-scale out
bindsym --no-repeat $mod+Mod1+underscore exec --no-startup-id ~/.local/bin/ui-scale out
bindsym --no-repeat $mod+Mod1+0          exec --no-startup-id ~/.local/bin/ui-scale reset
