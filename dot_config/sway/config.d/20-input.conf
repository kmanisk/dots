# ==============================================================================
# 20-input.conf — Keyboard, Touchpad, Pointer & Hardware Gestures
# ==============================================================================

# Keyboard settings (all devices identified as keyboards)
input type:keyboard {
    repeat_delay 400
    repeat_rate 20
}

# Touchpad settings
input type:touchpad {
    tap enabled
    natural_scroll enabled
    pointer_accel 0.0
    accel_profile adaptive
    scroll_factor 0.4
}

# Pointer settings (Pure raw 1:1 tracking, identical to Windows raw input with no curves)
input type:pointer {
    accel_profile flat
    pointer_accel 0.0
}

# Seat configuration: enable pointer constraints (cursor confinement / relative lock for games and Xwayland)
seat * pointer_constraint enable


# ------------------------------------------------------------------------------
# Touchpad Gestures (Native Sway - zero background daemon overhead)
# ------------------------------------------------------------------------------
# Workspaces & Window management (3 fingers)
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:left workspace next
bindgesture swipe:3:down scratchpad show
bindgesture pinch:3:outward fullscreen enable
bindgesture pinch:3:inward fullscreen disable

# Audio & Brightness Controls (4 fingers)
bindgesture swipe:4:up exec --no-startup-id ~/.local/bin/volume-notify up
bindgesture swipe:4:down exec --no-startup-id ~/.local/bin/volume-notify down
bindgesture swipe:4:right exec --no-startup-id ~/.local/bin/change-brightness +5%
bindgesture swipe:4:left exec --no-startup-id ~/.local/bin/change-brightness -5%

# Close window & Launchers (Pinch / Hold)
bindgesture pinch:4:inward kill
bindgesture hold:4 exec --no-startup-id ~/.local/bin/powermenu
