# ==============================================================================
# 50-gaming-mode.conf — Gaming / Passthrough Mode (Alt+Shift+F)
# All desktop shortcuts muted. Only workspace switching, OBS, screenshots active.
# Switching away from ws4 automatically returns to default desktop mode.
# ==============================================================================

mode "gaming" {
    # Plain bindings (active when window has no shortcut inhibitor)
    bindsym $mod+u    workspace number $ws1, mode "default"
    bindsym $mod+i    workspace number $ws2, mode "default"
    bindsym $mod+o    workspace number $ws3, mode "default"
    bindsym $mod+p    workspace number $ws4
    bindsym $mod+1    workspace number $ws1, mode "default"
    bindsym $mod+2    workspace number $ws2, mode "default"
    bindsym $mod+3    workspace number $ws3, mode "default"
    bindsym $mod+4    workspace number $ws4
    bindsym $mod+5    workspace number $ws5, mode "default"
    bindsym $mod+6    workspace number $ws6, mode "default"
    bindsym $mod+7    workspace number $ws7, mode "default"
    bindsym $mod+8    workspace number $ws8, mode "default"
    bindsym $mod+9    workspace number $ws9, mode "default"
    bindsym $mod+0    workspace number $ws10, mode "default"
    bindsym $mod+bracketleft  workspace number $ws5, mode "default"
    bindsym $mod+bracketright workspace number $ws6, mode "default"
    bindsym $mod+grave exec --no-startup-id ~/.local/bin/ws-toggle-2-4

    # Inhibited bindings (active if a game/client requests shortcut inhibitor)
    bindsym --inhibited $mod+u    workspace number $ws1, mode "default"
    bindsym --inhibited $mod+i    workspace number $ws2, mode "default"
    bindsym --inhibited $mod+o    workspace number $ws3, mode "default"
    bindsym --inhibited $mod+p    workspace number $ws4
    bindsym --inhibited $mod+1    workspace number $ws1, mode "default"
    bindsym --inhibited $mod+2    workspace number $ws2, mode "default"
    bindsym --inhibited $mod+3    workspace number $ws3, mode "default"
    bindsym --inhibited $mod+4    workspace number $ws4
    bindsym --inhibited $mod+5    workspace number $ws5, mode "default"
    bindsym --inhibited $mod+6    workspace number $ws6, mode "default"
    bindsym --inhibited $mod+7    workspace number $ws7, mode "default"
    bindsym --inhibited $mod+8    workspace number $ws8, mode "default"
    bindsym --inhibited $mod+9    workspace number $ws9, mode "default"
    bindsym --inhibited $mod+0    workspace number $ws10, mode "default"
    bindsym --inhibited $mod+bracketleft  workspace number $ws5, mode "default"
    bindsym --inhibited $mod+bracketright workspace number $ws6, mode "default"
    bindsym --inhibited $mod+grave exec --no-startup-id ~/.local/bin/ws-toggle-2-4

    # Exit gaming mode back to normal desktop mode
    bindsym --to-code Mod1+Shift+f mode "default", exec notify-send -t 1500 -i input-gaming "Gaming Mode: OFF" "Desktop shortcuts restored"
    bindsym --to-code --inhibited Mod1+Shift+f mode "default", exec notify-send -t 1500 -i input-gaming "Gaming Mode: OFF" "Desktop shortcuts restored"
    bindsym Mod1+Shift+F mode "default", exec notify-send -t 1500 -i input-gaming "Gaming Mode: OFF" "Desktop shortcuts restored"
    bindsym --inhibited Mod1+Shift+F mode "default", exec notify-send -t 1500 -i input-gaming "Gaming Mode: OFF" "Desktop shortcuts restored"

    # Screenshot in gaming mode
    bindsym $mod+Shift+s exec --no-startup-id ~/.local/bin/screenshot-fullscreen
    bindsym --inhibited $mod+Shift+s exec --no-startup-id ~/.local/bin/screenshot-fullscreen
    bindsym Print exec --no-startup-id ~/.local/bin/screenshot-fullscreen
    bindsym --inhibited Print exec --no-startup-id ~/.local/bin/screenshot-fullscreen

    # OBS Studio Hotkeys (Start: Alt+Shift+R | Stop: Alt+Shift+X)
    bindsym --to-code Mod1+Shift+r exec --no-startup-id obs --startrecording
    bindsym --to-code --inhibited Mod1+Shift+r exec --no-startup-id obs --startrecording
    bindsym Mod1+Shift+R exec --no-startup-id obs --startrecording
    bindsym --inhibited Mod1+Shift+R exec --no-startup-id obs --startrecording
    bindsym --to-code Mod1+Shift+x exec --no-startup-id obs --stoprecording
    bindsym --to-code --inhibited Mod1+Shift+x exec --no-startup-id obs --stoprecording
    bindsym Mod1+Shift+X exec --no-startup-id obs --stoprecording
    bindsym --inhibited Mod1+Shift+X exec --no-startup-id obs --stoprecording
}

# Enter gaming mode
bindsym --to-code Mod1+Shift+f mode "gaming", exec notify-send -t 1500 -i input-gaming "Gaming Mode: ON" "Workspaces, Screenshot & OBS hotkeys active"
bindsym --to-code --inhibited Mod1+Shift+f mode "gaming", exec notify-send -t 1500 -i input-gaming "Gaming Mode: ON" "Workspaces, Screenshot & OBS hotkeys active"
bindsym Mod1+Shift+F mode "gaming", exec notify-send -t 1500 -i input-gaming "Gaming Mode: ON" "Workspaces, Screenshot & OBS hotkeys active"
bindsym --inhibited Mod1+Shift+F mode "gaming", exec notify-send -t 1500 -i input-gaming "Gaming Mode: ON" "Workspaces, Screenshot & OBS hotkeys active"
