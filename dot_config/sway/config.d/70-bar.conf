# ==============================================================================
# 70-bar.conf — Swaybar Status Bar Configuration
# Native Swaybar with zero external daemon overhead, styled by base46 dynamic theme
# ==============================================================================

# Status Bar definition & colors
include ~/.local/state/theme/swaybar.conf

# Persistent bar state restoration
exec_always --no-startup-id sh -c '[ "$(cat ~/.config/polybar/bar_state 2>/dev/null)" = "true" ] && swaymsg "bar bar-0 mode dock"'
