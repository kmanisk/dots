# ==============================================================================
# 00-variables.conf — Modifiers, Workspaces, Fonts & Defaults
# ==============================================================================

# Modifier key: Super / Windows key
set $mod Mod4

# Workspace Definitions
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# Font
font pango:Iosevka Nerd Font 13

# Floating modifier (drag/resize already-floating windows with Super + mouse).
# Keep tiled containers immutable under mouse drags: Sway enables tiling_drag by
# default, which lets titlebar or Super+mouse drags turn a tiled browser into a
# user_on floating container after its one-shot for_window rule has already run.
floating_modifier $mod normal
tiling_drag disable

# Terminal (Foot client-server mode; behavior lives in ~/.config/foot/foot.ini)
set $term footclient

# Focus activation: smart (only focus window requesting focus if it is already
# visible on the active workspace; otherwise set urgent without switching workspace).
focus_on_window_activation smart
