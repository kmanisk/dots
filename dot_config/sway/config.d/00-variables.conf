# ==============================================================================
# 00-variables.conf — Modifiers, Workspaces, Fonts & Defaults
# ==============================================================================

# Modifier key: Super / Windows key
set $mod Mod4

# Workspace Definitions
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# Font
font pango:Iosevka Nerd Font 13

# Floating modifier (drag floating windows with Super + mouse button)
floating_modifier $mod normal

# Terminal (Client-Server daemon mode for ultra-low memory, direct color loading)
set $term footclient -o font="Iosevka Nerd Font Mono:size=16:style=Regular" -o selection-target=both -o mouse-bindings.primary-paste=none -o mouse-bindings.clipboard-paste=BTN_MIDDLE -o mouse-bindings.font-increase=none -o mouse-bindings.font-decrease=none -o mouse-bindings.scrollback-up-mouse="BTN_WHEEL_BACK Control+Mod1+BTN_WHEEL_BACK Mod1+Control+BTN_WHEEL_BACK Control+BTN_WHEEL_BACK Mod1+BTN_WHEEL_BACK Mod4+BTN_WHEEL_BACK Control+Mod4+BTN_WHEEL_BACK" -o mouse-bindings.scrollback-down-mouse="BTN_WHEEL_FORWARD Control+Mod1+BTN_WHEEL_FORWARD Mod1+Control+BTN_WHEEL_FORWARD Control+BTN_WHEEL_FORWARD Mod1+BTN_WHEEL_FORWARD Mod4+BTN_WHEEL_FORWARD Control+Mod4+BTN_WHEEL_FORWARD" -o key-bindings.show-urls-launch="Alt+o Control+Shift+o" -o include=~/.config/foot/foot-colors.ini

# Focus activation: smart (only focus window requesting focus if it is already
# visible on the active workspace; otherwise set urgent without switching workspace).
focus_on_window_activation smart
