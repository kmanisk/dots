# ==============================================================================
# ui-metrics.conf - Base sizes for system chrome, expressed at scale 1.00
# ==============================================================================
# Every value here is the on-screen size you want at UI scale 1.00. ui-sync
# converts them for the current scale using UI_CHROME_FOLLOW:
#
#   UI_CHROME_FOLLOW=0  (default) chrome keeps the same physical size at any
#                       scale; only application content zooms
#   UI_CHROME_FOLLOW=1            chrome zooms exactly like application content
#   anything between              partial follow
#
# Edit a value, then run: ui-sync
# ==============================================================================

# 0 = chrome keeps a constant physical size at any scale (default)
# 1 = chrome zooms exactly like application content
CHROME_FOLLOW=0

# Mako (OSD for brightness/volume/night light, and all notifications)
MAKO_FONT_FAMILY="Iosevka Nerd Font"
MAKO_FONT=13
MAKO_PADDING=10
MAKO_MARGIN=10
MAKO_WIDTH=380
MAKO_BORDER=2
MAKO_RADIUS=8

# Swaybar
BAR_FONT_FAMILY="Iosevka Nerd Font"
BAR_FONT=10

# Sway decorations: the tab bar drawn for tabbed containers
SWAY_FONT_FAMILY="Iosevka Nerd Font"
SWAY_TITLE_FONT=12.5
TITLEBAR_PADDING=2
TITLEBAR_BORDER=1

# Swaylock
LOCK_RADIUS=42
LOCK_THICKNESS=8
LOCK_FONT=13

# GTK applications that set an explicit font size in the theme CSS
GTK_FONT=13
