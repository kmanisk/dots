# aria2c configuration for fast segmented downloads & browser integration
dir=${HOME}/Downloads
continue=true
max-connection-per-server=16
split=16
min-split-size=10M
max-concurrent-downloads=5

# RPC Configuration (for Browser Extensions like Aria2 Integration)
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-allow-origin-all=true

# Disk cache and file allocation (falloc is optimal on Btrfs/Linux)
disk-cache=64M
file-allocation=falloc

# Reliability & timeouts
timeout=60
connect-timeout=30
max-tries=10
retry-wait=3
auto-file-renaming=true
summary-interval=1
