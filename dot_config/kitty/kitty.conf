# ===================================================================
# 🎨 THEME & COLORS (Integrated with theme-set system engine)
# ===================================================================
include kitty-colors.conf

# ===================================================================
# 🖥️  FONTS (Identical to Alacritty: VictorMono Nerd Font Bold @ 19.5)
# ===================================================================
font_family      family="VictorMono Nerd Font" style="Bold"
bold_font        family="VictorMono Nerd Font" style="Bold"
italic_font      family="VictorMono Nerd Font" style="Bold"
bold_italic_font family="VictorMono Nerd Font" style="Bold"

font_size 19.5
disable_ligatures never

# ===================================================================
# 🖱️  CURSOR (Identical to Alacritty: Block, blinking off)
# ===================================================================
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# ===================================================================
# 📜 SELECTION & CLIPBOARD
# ===================================================================
copy_on_select yes
mouse_map middle release ungrabbed paste_from_clipboard

# ===================================================================
# 🖼️  WINDOW & AESTHETICS (Minimal, zero decoration, matching Alacritty)
# ===================================================================
hide_window_decorations yes
confirm_os_window_close 0
window_padding_width 0
enable_audio_bell no
linux_display_server wayland

# ===================================================================
# ⚡ PERFORMANCE & LATENCY
# ===================================================================
sync_to_monitor yes
input_delay 2
repaint_delay 6
update_check_interval 0

# ===================================================================
# ⌨️  KEYBINDINGS (Matching Alacritty)
# ===================================================================
# Super+C / Super+V for Universal Copy/Paste
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Alt+Shift+U / Alt+Shift+Y for font size zoom
map alt+shift+u change_font_size all +1.0
map alt+shift+y change_font_size all -1.0
map alt+shift+equal change_font_size all +1.0
map alt+shift+minus change_font_size all -1.0

# Open URLs
open_url_with xdg-open
url_prefixes http https file git ssh mailto
