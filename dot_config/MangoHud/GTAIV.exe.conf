################### GTA IV MangoHud Configuration ###################
legacy_layout=0
horizontal
hud_compact
hud_no_margin
no_small_font

# Placement & Visual Styling
position=top-left
background_alpha=0.35
round_corners=6
background_color=0B0F14
text_color=E2E8F0
text_outline=1
text_outline_color=000000
text_outline_thickness=1.2
horizontal_separator_color=64748B
cellpadding_y=-0.08

preset=1,2,0
toggle_hud=Alt_L+3
toggle_preset=Alt_L+4
toggle_hud_position=Alt_L+5
reset_fps_metrics=Alt_L+6
toggle_fps_limit=Alt_L+7
reload_cfg=Alt_L+8

# Display on launch & default font size
no_display=0
font_size=20
font_size_text=20

# --- 1. Current FPS & Frametime ---
fps_text=FPS
fps
frametime

# --- 2. CPU (Usage, Temp, Power) ---
cpu_text=CPU
cpu_color=38BDF8
cpu_stats
cpu_temp
cpu_power

# --- 3. GPU (Usage, Temp, Power) ---
pci_dev=0000:01:00.0
gpu_text=GPU
gpu_color=84CC16
gpu_stats
gpu_temp
gpu_power

# --- 4. Memory (VRAM & RAM) ---
vram
vram_color=84CC16
ram
ram_color=38BDF8

# --- 5. Framerate Pacing & Pacing Method ---
frame_timing=1
vsync=3
fps_limit=165
