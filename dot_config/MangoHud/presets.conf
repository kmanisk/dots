# MangoHud presets — cycled in-game with Alt+4 (toggle_preset).
# Preset 0 is the default state: HUD hidden, base font size.
# Presets 1-2 force the HUD visible at increasing font sizes (20 / 30).
# Font sizes live here rather than in the game configs because config-file
# values override preset values — preset-owned fonts keep Alt+4 working everywhere.

[preset 0]
no_display
font_size=15
font_size_text=15

[preset 1]
no_display=0
font_size=20
font_size_text=20

[preset 2]
no_display=0
font_size=30
font_size_text=30
