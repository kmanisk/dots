################### Global MangoHud Configuration ###################
# Minimal horizontal HUD — single source of truth for every game; hidden by default (Alt+3), font presets via Alt+4; logging disabled.
legacy_layout=0
horizontal
hud_compact
hud_no_margin
no_small_font

# Placement & Visual Styling
position=top-left
font_file=/usr/share/fonts/TTF/Hack-Bold.ttf
# Font sizes (font_size / font_size_text) are owned by ~/.config/MangoHud/presets.conf
background_alpha=0.35
round_corners=6
background_color=0B0F14
text_color=E2E8F0
text_outline=1
text_outline_color=000000
text_outline_thickness=1.2
horizontal_separator_color=64748B
cellpadding_y=-0.08

# --- In-Game Keys & Presets (60% keyboard: no physical F-row) ---
# Alt+3 HUD on/off | Alt+4 font-size presets (15/20/30) | Alt+5 HUD position
# Alt+6 reset FPS metrics | Alt+7 frame-cap toggle | Alt+8 reload config
# MangoHud debounces hotkeys ~0.4s: press once, pause, press again — rapid taps count once.
# Alt+5 steps one of 8 anchors per press; the three anchors in a row (left/center/right)
# draw in the same spot on this full-width HUD, so the visible change is top/middle/bottom.
# The hidden-by-default state and the font sizes are owned by ~/.config/MangoHud/presets.conf
preset=0,1,2
toggle_hud=Alt_L+3
toggle_preset=Alt_L+4
toggle_hud_position=Alt_L+5
reset_fps_metrics=Alt_L+6
toggle_fps_limit=Alt_L+7
reload_cfg=Alt_L+8

# --- 1. Current FPS & Frametime ---
fps_text=FPS
fps
frametime

# --- 2. CPU (Usage, Temp, Power - Clock MHz Removed) ---
cpu_text=CPU
cpu_color=38BDF8
cpu_stats
cpu_temp
cpu_power

# --- 3. GPU (Usage, Temp, Power - Clock MHz Removed) ---
pci_dev=0000:01:00.0
gpu_text=GPU
gpu_color=84CC16
gpu_stats
gpu_temp
gpu_power

# --- 4. Memory (VRAM & RAM) ---
vram
vram_color=84CC16
ram
ram_color=38BDF8

# --- 5. Framerate Pacing & Pacing Method ---
frame_timing=1
vsync=0

blacklist=zenity,protonplus,lsfg-vk-ui,bazzar,gnome-calculator,pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex,python,python3,python3.14,modengine2_launcher.exe
