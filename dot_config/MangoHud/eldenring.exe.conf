# Per-game MangoHud override for Elden Ring — dormant fallback: the live config is loaded via
# MANGOHUD_CONFIGFILE from the prefix's user_settings.py; this file only applies to bare mangohud runs.
# Hidden by default; same in-game keys as the rest of the system (Alt+3 toggles, Alt+4 font
# presets 15/20/30, Alt+5 position); MangoHud debounces hotkeys ~0.4s, so pause between
# presses. Pins the frame cap to 60.
preset=0,1,2
toggle_hud=Alt_L+3
toggle_preset=Alt_L+4
toggle_hud_position=Alt_L+5
reset_fps_metrics=Alt_L+6
toggle_fps_limit=Alt_L+7
reload_cfg=Alt_L+8
fps_limit=60
