# Persistent physical input selection; processing stays in the existing graph.
wireplumber.settings.schema = {
  micstudio.input = {
    name = "MicStudio capture input"
    description = "Preferred physical capture node name; empty selects a physical fallback"
    type = "string"
    default = ""
  }
}
wireplumber.components = [
  { name = "micstudio-input.lua", type = script/lua, provides = hooks.micstudio.input, requires = [ support.settings ] }
]
wireplumber.profiles = {
  main = { hooks.micstudio.input = required }
}
