# WirePlumber ALSA Policy Overrides
# - Highest session priority for built-in analog audio
# - Auto-port and auto-profile enabled for instant headphone jack switching

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port    = false
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.*analog-stereo"
      }
    ]
    actions = {
      update-props = {
        # Give wired analog headphones/speakers highest priority over virtual nodes
        priority.session = 2000
        session.suspend-timeout-seconds = 0
        api.alsa.headroom = 1024
      }
    }
  }
]
