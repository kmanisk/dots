# ==============================================================================
# WirePlumber Bluetooth Policy & Latency Optimization
# ==============================================================================
# - Keeps Bluetooth playback A2DP-only; disables HSP/HFP microphone switching
# - Prioritizes AAC & SBC-XQ with dedicated 1024/48000 buffer for glitch-free audio
# ==============================================================================

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.hfphsp-backend = "none"
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = false
  bluez5.codecs = [ aac sbc_xq sbc ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        session.suspend-timeout-seconds = 0
        node.latency = "1024/48000"
      }
    }
  }
]
