# Auto-generated by theme-set
# Theme: compiled from {{name}}

[mgr]
cwd = { fg = "{{accent}}", bold = true }
find_keyword = { fg = "{{yellow}}", italic = true, bold = true }
find_position = { fg = "{{purple}}", italic = true }

# Marker
marker_copied = { fg = "{{green}}", bg = "{{green}}" }
marker_cut = { fg = "{{red}}", bg = "{{red}}" }
marker_selected = { fg = "{{blue}}", bg = "{{blue}}" }

# Tab
tab_active = { fg = "{{black}}", bg = "{{accent}}" }
tab_inactive = { fg = "{{fg}}", bg = "{{one_bg2}}" }

# Border
border_symbol = "│"
border_style = { fg = "{{grey}}" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{one_bg2}}", bg = "{{one_bg2}}" }

mode_normal = { fg = "{{black}}", bg = "{{blue}}", bold = true }
mode_select = { fg = "{{black}}", bg = "{{green}}", bold = true }
mode_unset = { fg = "{{black}}", bg = "{{red}}", bold = true }

progress_label = { fg = "{{fg}}", bold = true }
progress_normal = { fg = "{{blue}}", bg = "{{one_bg}}" }
progress_error = { fg = "{{red}}", bg = "{{one_bg}}" }

permissions_t = { fg = "{{blue}}" }
permissions_r = { fg = "{{yellow}}" }
permissions_w = { fg = "{{red}}" }
permissions_x = { fg = "{{green}}" }
permissions_s = { fg = "{{grey_fg}}" }

[input]
border = { fg = "{{accent}}" }
title = {}
value = { fg = "{{fg}}" }
selected = { bg = "{{one_bg2}}" }

[select]
border = { fg = "{{accent}}" }
active = { fg = "{{accent}}", bold = true }
inactive = { fg = "{{fg}}" }

[tasks]
border = { fg = "{{accent}}" }
title = {}
hovered = { fg = "{{accent}}", underline = true }

[which]
mask = { bg = "{{one_bg}}" }
cand = { fg = "{{cyan}}" }
rest = { fg = "{{grey_fg}}" }
desc = { fg = "{{fg}}" }
separator = "  "
separator_style = { fg = "{{grey}}" }

[help]
on = { fg = "{{green}}" }
run = { fg = "{{cyan}}" }
desc = { fg = "{{fg}}" }
hovered = { bg = "{{one_bg2}}" }
footer = { fg = "{{bg}}", bg = "{{fg}}" }

[notify]
title_info = { fg = "{{green}}" }
title_warn = { fg = "{{yellow}}" }
title_error = { fg = "{{red}}" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "{{teal}}" },
	# Media
	{ mime = "{audio,video}/*", fg = "{{purple}}" },
	# Archives
	{ mime = "application/*zip*", fg = "{{red}}" },
	{ mime = "application/x-tar", fg = "{{red}}" },
	{ mime = "application/x-bzip2", fg = "{{red}}" },
	{ mime = "application/x-7z-compressed", fg = "{{red}}" },
	{ mime = "application/x-rar", fg = "{{red}}" },
	# Documents
	{ mime = "application/pdf", fg = "{{orange}}" },
	# Fallback
	{ mime = "*", fg = "{{fg}}" },
	{ mime = "*/", fg = "{{folder_bg}}" },
]

[icon]
prepend_conds = [
	{ if = "dir & hovered", text = "", fg = "{{accent}}" },
	{ if = "dir", text = "", fg = "{{folder_bg}}" },
]
