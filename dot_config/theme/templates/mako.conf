# Mako notification daemon — auto-generated from theme-set
default-timeout=2000

# Typography & geometry
font=Iosevka Nerd Font 15
background-color={{black}}
text-color={{white}}
border-color={{accent}}
progress-color=over {{accent}}50
border-size=2
border-radius=8
padding=14
margin=12
width=420
max-visible=5

[urgency=low]
background-color={{black}}
text-color={{base05}}
border-color={{one_bg2}}
progress-color=over {{one_bg2}}80

[urgency=normal]
background-color={{black}}
text-color={{white}}
border-color={{accent}}
progress-color=over {{accent}}50

[urgency=critical]
background-color={{black}}
border-color={{red}}
text-color={{red}}
progress-color=over {{red}}50

# Volume OSD
[app-name="Volume"]
group-by=app-name
text-color={{white}}
border-color={{blue}}
progress-color=over {{blue}}50

# Brightness OSD (uses dynamic theme accent with translucent progress bar for crisp text contrast)
[app-name="Brightness"]
group-by=app-name
text-color={{white}}
border-color={{accent}}
progress-color=over {{accent}}45

# Night Light OSD
[app-name="Night Light"]
group-by=app-name
text-color={{white}}
border-color={{orange}}
progress-color=over {{orange}}50

# Screenshot Notification
[app-name="Screenshot"]
group-by=app-name
text-color={{white}}
border-color={{teal}}
progress-color=over {{teal}}50

# Bluetooth battery popup
[app-name="BluetoothBattery"]
group-by=app-name

# Ignore stuck/bogus Bluetooth keyboard battery popup from Blueman
[app-name="blueman" summary="Katana*"]
invisible=1
