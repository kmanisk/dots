bar {
    id bar-0
    mode invisible
    position bottom
    status_command ~/.local/bin/swaybar-status
    font pango:Iosevka Nerd Font 11
    colors {
        background {{black}}
        statusline {{white}}
        separator {{grey}}
        focused_workspace {{border_focus}} {{tab_active_bg}} {{tab_active_fg}}
        active_workspace {{border_muted}} {{tab_active_bg}} {{tab_active_fg}}
        inactive_workspace {{tab_inactive_bg}} {{bg}} {{tab_inactive_fg}}
        urgent_workspace {{red}} {{tab_inactive_bg}} {{tab_urgent_fg}}
    }
}
