## ELinks 0.20.0 Configuration File
## Managed by Chezmoi

################################################################################
# General Configuration & Saving Style
################################################################################
# 0 = do not automatically overwrite hand-edited config comments and structure
set config.saving_style = 0
set config.comments = 0

################################################################################
# User Interface & Layout
################################################################################
# Tab Bar: Display tabs at top without confirmation prompts
set ui.tabs.show_bar = 2
set ui.tabs.top = 1
set ui.tabs.wraparound = 1
set ui.tabs.confirm_close = 0

# Link hints & contrast
set document.colors.use_document_colors = 1
set document.colors.ensure_contrast = 1
set document.browse.links.numbering = 0
set document.browse.links.use_tabindex = 1

# Mouse support enabled
set ui.mouse_disable = 0

################################################################################
# Terminal Capabilities (Foot / Modern 24-bit True Color & UTF-8)
################################################################################
set terminal.foot.colors = 4
set terminal.foot.utf_8_io = 1
set terminal.foot.transparency = 1
set terminal.foot.underline = 1
set terminal.foot.italic = 1

set terminal.xterm-256color.colors = 4
set terminal.xterm-256color.utf_8_io = 1
set terminal.xterm-256color.transparency = 1
set terminal.xterm-256color.underline = 1
set terminal.xterm-256color.italic = 1

################################################################################
# Vim Keybindings (Main Keymap)
################################################################################

# 1. Navigation & Scrolling (hjkl, half-page, full-page, document start/end)
bind "main" "j" = "scroll-down"
bind "main" "k" = "scroll-up"
bind "main" "h" = "scroll-left"
bind "main" "l" = "scroll-right"
bind "main" "Ctrl-D" = "move-half-page-down"
bind "main" "Ctrl-U" = "move-half-page-up"
bind "main" "Ctrl-F" = "move-page-down"
bind "main" "Ctrl-B" = "move-page-up"
bind "main" "g" = "move-document-start"
bind "main" "G" = "move-document-end"

# 2. Link Navigation & Hints
bind "main" "Tab" = "move-link-next"
bind "main" "Shift-Tab" = "move-link-prev"
bind "main" "Enter" = "link-follow"
bind "main" "f" = "toggle-numbered-links"
bind "main" "F" = "open-link-in-new-tab"

# 3. URL, History & Page Control
bind "main" "o" = "goto-url"
bind "main" "O" = "goto-url-current"
bind "main" "H" = "history-move-back"
bind "main" "L" = "history-move-forward"
bind "main" "u" = "history-move-back"
bind "main" "r" = "reload"
bind "main" "R" = "rerender"
bind "main" "y" = "copy-clipboard"

# 4. Search (/, ?, n, N)
bind "main" "/" = "search"
bind "main" "?" = "search-back"
bind "main" "n" = "find-next"
bind "main" "N" = "find-next-back"

# 5. Tab Management
bind "main" "t" = "open-new-tab"
bind "main" "x" = "tab-close"
bind "main" "d" = "tab-close"
bind "main" "X" = "reopen-last-closed-tab"
bind "main" "J" = "tab-next"
bind "main" "K" = "tab-prev"
bind "main" "]" = "tab-next"
bind "main" "[" = "tab-prev"
bind "main" ">" = "tab-move-right"
bind "main" "<" = "tab-move-left"

# 6. Bookmarks & Managers
bind "main" "m" = "add-bookmark-link"
bind "main" "M" = "add-bookmark"
bind "main" "b" = "bookmark-manager"
bind "main" "B" = "bookmark-manager"

# 7. Menu, Ex-mode & Quit
bind "main" "q" = "quit"
bind "main" "Q" = "really-quit"
bind "main" "Escape" = "menu"
bind "main" ":" = "exmode"

################################################################################
# Edit Keymap (Readline / Vim command-line editing)
################################################################################
bind "edit" "Ctrl-A" = "home"
bind "edit" "Ctrl-E" = "end"
bind "edit" "Ctrl-U" = "kill-to-bol"
bind "edit" "Ctrl-K" = "kill-to-eol"
bind "edit" "Ctrl-W" = "kill-word-back"
