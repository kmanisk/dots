virtual_modifiers:
  - CapsLock

modmap:
  - name: Global Modmap
    remap:
      CapsLock:
        held: CapsLock
        alone: Esc
        alone_timeout_millis: 200
      RightCtrl: RightMeta

keymap:
  # --- Alacritty Universal Copy / Paste / Cut (Safe against SIGINT) ---
  - name: Alacritty Universal Clipboard
    application:
      only: ["Alacritty"]
    exact_match: true
    remap:
      Super-c: C-S-c # Win+C -> Ctrl+Shift+C (safe copy without killing running processes)
      Super-v: C-S-v # Win+V -> Ctrl+Shift+V (safe paste)

  # --- General Universal Copy / Paste / Cut (All GUI Applications) ---
  - name: Universal Copy Paste
    application:
      not: ["Alacritty"]
    exact_match: true
    remap:
      Super-c: C-c # Win+C -> Ctrl+C (Universal Copy)
      Super-v: C-v # Win+V -> Ctrl+V (Universal Paste)
      Super-x: C-x # Win+X -> Ctrl+X (Universal Cut)

  # --- CapsLock layer ---
  - name: CapsLock layer
    remap:
      # Navigation
      CapsLock-h: Left
      CapsLock-j: Down
      CapsLock-k: Up
      CapsLock-l: Right
      CapsLock-o: C-Left
      CapsLock-p: C-Right
      # Brightness (CapsLock + [ and CapsLock + ')
      CapsLock-LEFTBRACE: BrightnessUp
      CapsLock-APOSTROPHE: BrightnessDown
      # Actions
      CapsLock-n: Enter
      CapsLock-SEMICOLON: [End, Enter]
      CapsLock-i: [C-a, BackSpace]
      CapsLock-g: [C-a, C-c, Right]
      CapsLock-y: C-z
      CapsLock-SLASH: C-A-q
      CapsLock-m: BackSpace
      CapsLock-u: C-BackSpace
      CapsLock-d: Delete
      CapsLock-f: C-f
      # Volume: , (<) = VolumeDown, . (>) = VolumeUp
      CapsLock-COMMA: VolumeDown
      CapsLock-DOT: VolumeUp
      # F-key row
      CapsLock-1: F1
      CapsLock-2: F2
      CapsLock-3: F3
      CapsLock-4: F4
      CapsLock-5: F5
      CapsLock-6: F6
      CapsLock-7: F7
      CapsLock-8: F8
      CapsLock-9: F9
      CapsLock-0: F10
      CapsLock-MINUS: F11
      CapsLock-EQUAL: F12
      # Volume (] for up, \ for down)
      CapsLock-RIGHTBRACE: VolumeUp
      CapsLock-BACKSLASH: VolumeDown
      # Screenshots:
      # - CapsLock + s: Region selection -> clipboard only (zero file storage)
      # - CapsLock + Space: Fullscreen -> saved to ~/Pictures/Screenshots + clipboard
      CapsLock-s: SysRq
      CapsLock-Space: Shift-SysRq

      # Window Close & Kill (Sway native integration):
      # - CapsLock + q: Graceful close (without reaching down to physical Super)
      # - CapsLock + BackSpace: Graceful close (two-handed)
      # - CapsLock + Shift + q / CapsLock + Shift + BackSpace: Force kill
      CapsLock-q: Super-q
      CapsLock-BackSpace: Super-BackSpace
      CapsLock-Shift-q: Super-Shift-q
      CapsLock-Shift-BackSpace: Super-Shift-BackSpace

      # Process Killer Menu (formerly Win+Shift+e):
      CapsLock-w:
        launch: ["/home/manisk/.local/bin/rofi-pkill"]

      # Silent Steam Launcher:
      CapsLock-e:
        launch: ["/home/manisk/.local/bin/steam-workspace", "--silent"]

      # Kill Steam & Games (Force Terminator):
      CapsLock-r:
        launch: ["/home/manisk/.local/bin/killgame"]

      # Passthrough
      CapsLock-a: a
      CapsLock-b: b
      CapsLock-c: c
      CapsLock-t: t
      CapsLock-v: v
      CapsLock-x: x
      CapsLock-z: z

  # --- Katana Sub-legends on Right Alt (brightness) ---
  # NOTE: `M-` means EITHER Alt, which is why Left Alt+Q/W was also
  # firing brightness. RightAlt- restricts to Right Alt only.
  - name: Katana sub-legends
    remap:
      RightAlt-q: BrightnessDown
      RightAlt-w: BrightnessUp

  # --- Misc ---
  - name: Misc
    exact_match: true
    remap:
      Alt-BackSpace: A-Left
      PageUp: Home

  # DISABLED 2026-09-15: full Thunar block commented out, nothing else touched.
  # # ============================================================
  # # THUNAR VIM LAYER
  # # WM_CLASS: thunar.Thunar  (confirmed via xremap --list-windows)
  # #
  # # Modes (global xremap modes, Thunar-gated via application:):
  # #   default          — normal xremap operation (all apps)
  # #   thunar_normal    — Thunar normal mode  (hjkl, yxp, d, r, gg/G …)
  # #
  # # Entry:  focus Thunar → press Esc → thunar_normal
  # # Exit:   i, or any text-entry action (r rename, / search, a new folder)
  # #         → back to default so typing works (vim-like insert)
  # # gg is a nested remap with timeout (no extra mode → no stuck state)
  # # ============================================================
  #
  # # --- (A) Esc in Thunar → enter normal mode -----------------
  # - name: Thunar enter normal mode
  #   application:
  #     only: ["thunar.Thunar"]
  #   remap:
  #     Esc: { set_mode: thunar_normal }
  #
  # # --- (B) Thunar NORMAL MODE — navigation & file ops --------
  # - name: Thunar normal navigation
  #   mode: thunar_normal
  #   application:
  #     only: ["thunar.Thunar"]
  #   remap:
  #     # ── Movement ────────────────────────────────────────────
  #     j: KEY_DOWN
  #     k: KEY_UP
  #     l: KEY_ENTER
  #     h: A-KEY_UP
  #
  #     # ── History ─────────────────────────────────────────────
  #     H: A-KEY_LEFT
  #     L: A-KEY_RIGHT
  #
  #     # ── Jump to home directory (in-place, no new window) ──────
  #     GRAVE: A-Home
  #
  #     # ── Page scrolling ───────────────────────────────────────
  #     C-d: [KEY_DOWN, KEY_DOWN, KEY_DOWN, KEY_DOWN, KEY_DOWN, KEY_DOWN, KEY_DOWN, KEY_DOWN]
  #     C-u: [KEY_UP, KEY_UP, KEY_UP, KEY_UP, KEY_UP, KEY_UP, KEY_UP, KEY_UP]
  #
  #     # ── First / last item (gg has 600ms window, lone g = type-ahead)
  #     G: C-End
  #     g:
  #       remap:
  #         g: C-Home
  #       timeout_millis: 600
  #       timeout_key: g
  #
  #     # ── File operations (text-entry actions drop to default first)
  #     y: C-c
  #     x: C-x
  #     p: C-v
  #     d: KEY_DELETE
  #     r: [{ set_mode: default }, KEY_F2]
  #     o: C-o
  #     a: [{ set_mode: default }, C-S-n]
  #
  #     # ── Selection / search passthrough ─────────────────────────
  #     # Space (select+advance in list view) and n are intentionally
  #     # unmapped: Thunar handles Space natively and n gives type-ahead.
  #     # (Old mappings Space→Down and n→F3 broke selection.)
  #
  #     # ── Search (drops to default so you can type the query) ────
  #     SLASH: [{ set_mode: default }, C-f]
  #
  #     # ── Quit ─────────────────────────────────────────────────
  #     q: C-q
  #
  #     # ── Exit normal mode ─────────────────────────────────────
  #     i: { set_mode: default }
  #
  # # --- (C) Reset mode when focus leaves Thunar -----------------
  # - name: Thunar reset normal on switch
  #   mode: thunar_normal
  #   application:
  #     not: ["thunar.Thunar"]
  #   remap:
  #     Esc: { set_mode: default }
