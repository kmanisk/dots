virtual_modifiers:
  - CapsLock

modmap:
  - name: Global Modmap
    remap:
      CapsLock:
        held: CapsLock
        alone: Esc
        alone_timeout_millis: 200
      RightAlt: RightMeta

keymap:
  # --- Universal Hardware Controls (Volume, Brightness, Vibrance in Games & Desktop) ---
  - name: Universal Hardware Controls
    remap:
      # Brightness (CapsLock + [ for up, ' for down)
      CapsLock-LEFTBRACE:
        launch: ["/home/manisk/.local/bin/change-brightness", "+5%"]
      CapsLock-APOSTROPHE:
        launch: ["/home/manisk/.local/bin/change-brightness", "5%-"]
      # Volume (CapsLock + ] for up, \ for down)
      CapsLock-RIGHTBRACE:
        launch: ["/home/manisk/.local/bin/volume-notify", "up"]
      CapsLock-BACKSLASH:
        launch: ["/home/manisk/.local/bin/volume-notify", "down"]
      # NVIDIA Vibrance (CapsLock + x for up, z for down)
      CapsLock-x:
        launch: ["/home/manisk/.local/bin/nvibrant-ctl", "up"]
      CapsLock-z:
        launch: ["/home/manisk/.local/bin/nvibrant-ctl", "down"]
      # Fullscreen Screenshot (Workspace 3 & 4 save to Screenshots/Gaming; other workspaces save to Screenshots + clipboard)
      CapsLock-Space:
        launch: ["/home/manisk/.local/bin/screenshot-fullscreen"]
      # Emergency kill game
      CapsLock-r:
        launch: ["/home/manisk/.local/bin/killgame"]
      CapsLock-Shift-r:
        launch: ["/home/manisk/.local/bin/killgame"]

  # --- Universal Paste (All GUI Applications; Win+C / Win+X pass through) ---
  - name: Universal Paste
    application:
      not: ["Alacritty", "kitty", "foot", "footclient", "scratch-term", "scratch-notes", "cs2", "gamescope", "eldenring.exe", "GTAIV.exe", "^steam_app_.*"]
    exact_match: true
    remap:
      Super-v: C-v # Win+V -> Ctrl+V (Universal Paste)

  # --- CapsLock layer ---
  - name: CapsLock layer
    application:
      not: ["cs2", "gamescope", "eldenring.exe", "GTAIV.exe", "^steam_app_.*"]
    remap:
      # Navigation
      CapsLock-h: Left
      CapsLock-j: Down
      CapsLock-k: Up
      CapsLock-l: Right
      CapsLock-o: C-Left
      CapsLock-p: C-Right
      CapsLock-Alt-j: { launch: ["/home/manisk/.local/bin/xscroll", "down"] }
      CapsLock-Alt-k: { launch: ["/home/manisk/.local/bin/xscroll", "up"] }
      # Actions
      CapsLock-n: Enter
      CapsLock-SEMICOLON: [End, Enter]
      CapsLock-i: [C-a, BackSpace]
      CapsLock-g: [C-a, C-c, Right]
      CapsLock-y: C-z
      CapsLock-SLASH: C-A-q
      CapsLock-m: BackSpace
      CapsLock-u: C-BackSpace
      CapsLock-d: Delete
      CapsLock-f: C-f
      # Copy / Paste (AHK migration: , = SelectAll+Copy, . = Paste)
      CapsLock-COMMA: [C-a, C-c]
      CapsLock-DOT: C-v
      # F-key row
      CapsLock-1: F1
      CapsLock-2: F2
      CapsLock-3: F3
      CapsLock-4: F4
      CapsLock-5: F5
      CapsLock-6: F6
      CapsLock-7: F7
      CapsLock-8: F8
      CapsLock-9: F9
      CapsLock-0: F10
      CapsLock-MINUS: F11
      CapsLock-EQUAL: F12
      # Screenshots:
      # - CapsLock + s: Region selection -> saved to ~/Pictures/Screenshots + clipboard
      CapsLock-s:
        launch: ["/home/manisk/.local/bin/screenshot-region", "--save"]

      # Window Close & Kill (Sway native integration):
      # - CapsLock + q: Graceful close (Win+q = polite WM_DELETE)
      # - CapsLock + BackSpace: Force kill (Win+BackSpace = force-kill-window, 2026-10-18)
      CapsLock-q: Super-q
      CapsLock-BackSpace: Super-BackSpace

      # Process Killer Menu (formerly Win+Shift+e):
      CapsLock-w:
        launch: ["/home/manisk/.local/bin/rofi-pkill"]

      # Steam Launch (was Alt+Shift+S):
      CapsLock-e:
        launch: ["/bin/sh", "-c", "STEAM_DGPU=1 ~/.local/bin/steam-workspace"]

      # Passthrough
      CapsLock-a: a
      CapsLock-b: b
      CapsLock-c: c
      CapsLock-t: t
      # Clipboard image viewer (clipboard image -> imv)
      CapsLock-v:
        launch: ["/home/manisk/.local/bin/clipboard-view"]

  # --- Terminal Scrollback (agy & foot terminals) ---
  # Inline CLI tools like agy and standard shell sessions use Foot's native scrollback keys.
  - name: Terminal scrollback
    application:
      only: ["foot", "footclient", "scratch-term", "scratch-notes"]
    window:
      not: ["/OC \\|/"]
    exact_match: true
    remap:
      Alt-Ctrl-j: [C-S-j, C-S-j, C-S-j]
      Ctrl-Alt-j: [C-S-j, C-S-j, C-S-j]
      Alt-Ctrl-k: [C-S-k, C-S-k, C-S-k]
      Ctrl-Alt-k: [C-S-k, C-S-k, C-S-k]
      CapsLock-Alt-j: [C-S-j, C-S-j, C-S-j]
      CapsLock-Alt-k: [C-S-k, C-S-k, C-S-k]

  # --- Mouse scroll (Alt+Ctrl layer, vim-style: j=down, k=up) ---
  # Operates on opencode, Brave, and other GUI apps via persistent uinput wheel emulator.
  - name: Scroll emulation
    exact_match: true
    remap:
      Alt-Ctrl-j: { launch: ["/home/manisk/.local/bin/xscroll", "down"] }
      Ctrl-Alt-j: { launch: ["/home/manisk/.local/bin/xscroll", "down"] }
      Alt-Ctrl-k: { launch: ["/home/manisk/.local/bin/xscroll", "up"] }
      Ctrl-Alt-k: { launch: ["/home/manisk/.local/bin/xscroll", "up"] }

  # --- Katana Sub-legends on Right Alt (brightness) ---
  # REMOVED 2026-10-02: RightAlt-q/w entries were dead — modmap converts
  # RightAlt to RightMeta before keymap matching, so Sway eats them as
  # Super+q (kill) / Super+w. Brightness lives on Caps+[ / Caps+'.

  # --- Misc ---
  - name: Misc
    exact_match: true
    remap:
      Alt-BackSpace: A-Left
      PageUp: Home

  # DISABLED 2026-09-15: full Thunar block commented out, nothing else touched.
  # # ============================================================
  # # THUNAR VIM LAYER
  # # WM_CLASS: thunar.Thunar  (confirmed via xremap --list-windows)
