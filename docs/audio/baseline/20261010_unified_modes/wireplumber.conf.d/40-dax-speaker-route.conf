# WirePlumber 0.5 Component Configuration
# Loads dax-speaker-route.lua to dynamically manage smart filter state
# based on active ALSA physical route (Speaker vs Headphones).

wireplumber.components = [
  {
    name = "dax-speaker-route.lua", type = script/lua
    provides = custom.dax-speaker-route
  }
]

wireplumber.profiles = {
  main = {
    custom.dax-speaker-route = required
  }
}
