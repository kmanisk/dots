# WirePlumber 0.5 Gaming Audio Routing Component
# Automatically routes explicitly allowlisted competitive games to sink.peace_gaming
# (Peace PUBG EQ + Native LoudMax LADSPA) while all desktop apps route to default hardware.
#
# Hardening invariants:
# 1. Matches ONLY Stream/Output/Audio playback streams.
# 2. Never captures or diverts microphone/recording streams (Stream/Input/Audio).
# 3. Explicitly sets has_defined_target to prevent smart filter (sink.asus_speakers) from wrapping games.

wireplumber.components = [
  {
    name = "gaming-audio-route.lua", type = script/lua
    provides = custom.gaming-audio-route
  }
]

wireplumber.profiles = {
  main = {
    custom.gaming-audio-route = required
  }
}
