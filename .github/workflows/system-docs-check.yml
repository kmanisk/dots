name: system-docs-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi

          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"

      - name: Verify system documentation contract
        shell: bash
        run: |
          chmod +x scripts/check-system-docs.sh
          scripts/check-system-docs.sh --range \
            "${{ steps.range.outputs.base }}" \
            "${{ steps.range.outputs.head }}"
